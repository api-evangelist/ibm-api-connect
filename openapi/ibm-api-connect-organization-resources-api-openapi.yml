        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityZone'
            examples:
              AvailabilityZone:
                summary: Example availability zone creation.
                value:
                  name: acme-zone
                  title: acme zone
                  summary: An example availability zone
