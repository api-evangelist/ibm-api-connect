        subscriber_event_url:
          type: string
        filter:
          type: string
        request_id:
          type: string
        description:
          type: string
        state:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        sent_at:
          type: string
        processed_at:
          type: string
  parameters:
    limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
    fields:
      name: fields
      in: query
      description: List of field names to return
      required: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: Offset item number from list to begin return
      required: false
      schema:
        type: integer
    resource_url:
      name: resource_url
      in: query
      description: URL of the resource
      required: false
      schema:
        type: string
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
