            application/yaml:
              schema:
                $ref: '#/components/schemas/WebhookList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Webhooks
    servers:
    - url: ''
      description: APIM base path
