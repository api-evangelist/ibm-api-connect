openapi: 3.2.0
info:
  title: Ibm Api Connect Cloud Settings API
  version: 2.0.0
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
  termsOfService: https://www.ibm.com/legal
  x-refined-note:
  - x-ibm-name differs across the merged source definitions and was not carried
  description: 'Operations tagged Cloud Settings across 2 of this provider''s published API definitions: ibm-api-connect-cloud-management-api-openapi.yml, ibm-api-connect-discovery-api-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Cloud Settings
paths:
  /cloud/settings:
    description: Cloud Setting object operations
    get:
      summary: Get the Cloud Setting object
      operationId: cloud_setting_singletonGet
      security:
      - oauth:
        - cloud:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSetting'
            application/yaml:
              schema:
                $ref: '#/components/schemas/CloudSetting'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Cloud Settings
    put:
      summary: Update the Cloud Setting object
      description: 'Update the Cloud Setting object


        Fields not allowed to be null:

        - email_sender

        - tls_client_profile_default_url


        Fields not allowed:

        - service_type

        - cloud_id

        - ibm_cloud


        Fields allowed but ignored:

        - name

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: cloud_setting_singletonUpdate
      security:
      - oauth:
        - cloud:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudSetting'
            examples:
              CloudSetting:
                summary: Example of fields which can be updated on a cloud settings object.
                value:
                  mail_server_url: https://acme-apim.example.com/api/orgs/mail-servers
                  invitation_ttl: 172800
                  reset_password_ttl: 172800
                  provision_sandbox_catalog: true
                  restrict_member_manage_permission: false
                  access_token_expires_in: 28800
                  refresh_token_enabled: false
                  refresh_expires_in: 57600
                  api_key_enabled: true
                  api_key_expires_in: 300
                  api_key_multiple_uses: false
                  sso_settings:
                    enabled: false
                    registration_urls: []
                    user_registry_urls: []
                  audit_setting:
                    mode: non_block
                    enabled: false
                    audit_reads:
                      enabled: false
                      response_data_to_http_endpoints:
                        enabled: false
                        list_results_limit: 0
                  gateway_service_default_urls:
                  - https://acme-apim.example.com/api/orgs/availability-zones/gateway-service1
                  - https://acme-apim.example.com/api/orgs/availability-zones/gateway-service2
                  email_sender:
                    name: ACME Administrator
                    address: acme-mail@example.com
                  tls_client_profile_default_url: https://acme-apim.example.com/api/orgs/tls-client-profiles
                  access_token_keystore_urls:
                  - https://acme-apim.example.com/api/orgs/keystores
                  id_token_keystore_urls:
                  - https://acme-apim.example.com/api/orgs/keystores
                  temporary_token_keystore_urls:
                  - https://acme-apim.example.com/api/orgs/keystores
                  self_signed_token_keystore_urls:
                  - https://acme-apim.example.com/api/orgs/keystores
                  temporary_token_format: b64
                  sync_roles_setting:
                    enabled: false
          application/yaml:
            schema:
              $ref: '#/components/schemas/CloudSetting'
            examples:
              CloudSetting:
                summary: Example of fields which can be updated on a cloud settings object.
                value:
                  mail_server_url: https://acme-apim.example.com/api/orgs/mail-servers
                  invitation_ttl: 172800
                  reset_password_ttl: 172800
                  provision_sandbox_catalog: true
                  restrict_member_manage_permission: false
                  access_token_expires_in: 28800
                  refresh_token_enabled: false
                  refresh_expires_in: 57600
                  api_key_enabled: true
                  api_key_expires_in: 300
                  api_key_multiple_uses: false
                  sso_settings:
                    enabled: false
                    registration_urls: []
                    user_registry_urls: []
                  audit_setting:
                    mode: non_block
                    enabled: false
                    audit_reads:
                      enabled: false
                      response_data_to_http_endpoints:
                        enabled: false
                        list_results_limit: 0
                  gateway_service_default_urls:
                  - https://acme-apim.example.com/api/orgs/availability-zones/gateway-service1
                  - https://acme-apim.example.com/api/orgs/availability-zones/gateway-service2
                  email_sender:
                    name: ACME Administrator
                    address: acme-mail@example.com
                  tls_client_profile_default_url: https://acme-apim.example.com/api/orgs/tls-client-profiles
                  access_token_keystore_urls:
                  - https://acme-apim.example.com/api/orgs/keystores
                  id_token_keystore_urls:
                  - https://acme-apim.example.com/api/orgs/keystores
                  temporary_token_keystore_urls:
                  - https://acme-apim.example.com/api/orgs/keystores
                  self_signed_token_keystore_urls:
                  - https://acme-apim.example.com/api/orgs/keystores
                  temporary_token_format: b64
                  sync_roles_setting:
                    enabled: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudSetting'
            application/yaml:
              schema:
                $ref: '#/components/schemas/CloudSetting'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Cloud Settings
    servers:
    - url: ''
