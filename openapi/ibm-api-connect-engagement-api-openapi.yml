openapi: 3.2.0
info:
  x-ibm-name: engagement
  version: 2.0.0
  title: IBM API Connect Engagement API
  x-ibm-summary: API for the API Connect Engagement system
  description: '## API for the API Connect Engagement system'
  termsOfService: https://www.ibm.com/terms-of-service
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
servers:
- url: ''
  description: Engagement V2 base path
tags:
- name: Engagement
paths:
  /{analytics-service}/orgs/{org}/engagement-config:
    description: 'Return the supported engagement configuration at provider organization scope.

      '
    parameters:
    - $ref: '#/components/parameters/accept_language_optional'
    - $ref: '#/components/parameters/analytics-service'
    - $ref: '#/components/parameters/org'
    get:
      summary: Engagement configuration supported at provider organization scope
      description: Return the supported engagement configuration at provider organization scope.
      operationId: engagementconfig_orgList
      security:
      - oauth:
        - api-analytics:view
      responses:
        '200':
          $ref: '#/components/responses/EngagementConfigResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Engagement
  /{analytics-service}/orgs/{org}/anomaly-detectors:
    description: 'Return anomaly detectors for a provider organization.

      '
    parameters:
    - $ref: '#/components/parameters/accept_language_optional'
    - $ref: '#/components/parameters/analytics-service'
    - $ref: '#/components/parameters/org'
    get:
      summary: List anomaly detectors at provider organization scope
      description: Returns all anomaly detectors belonging to a provider organization.
      operationId: anomaly_detectors_orgList
      security:
      - oauth:
        - api-analytics:view
      parameters:
      - $ref: '#/components/parameters/limit_optional'
      - $ref: '#/components/parameters/offset_optional'
      - $ref: '#/components/parameters/search_optional'
      responses:
        '200':
          $ref: '#/components/responses/AnomalyDetectorsListResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Engagement
    post:
      summary: Create an anomaly detector at provider organization scope
      description: Creates a new anomaly detector for the provider organization. Use detector_type "latency" or "traffic-volume" to provision a pre-built detector, or omit detector_type to supply a fully custom configuration.
      operationId: anomaly_detectors_orgCreate
      security:
      - oauth:
        - engagement:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyDetectorCreateRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/AnomalyDetectorCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/AnomalyDetectorCreateResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Engagement
  /{analytics-service}/orgs/{org}/anomaly-detectors/templates/{detector-type}:
    description: 'Create a pre-configured anomaly detector from a built-in template.

      '
    parameters:
    - $ref: '#/components/parameters/accept_language_optional'
    - $ref: '#/components/parameters/analytics-service'
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/detector-type'
    post:
      summary: Create an anomaly detector from a template
      description: Creates an anomaly detector using a pre-built template. The detectorType path parameter must be one of "latency", "traffic-volume", or "api-event-volume".
      operationId: anomaly_detectors_orgCreateFromTemplate
      security:
      - oauth:
        - engagement:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyDetectorTemplateRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/AnomalyDetectorTemplateRequest'
      responses:
        '201':
          $ref: '#/components/responses/AnomalyDetectorCreateResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Engagement
  /{analytics-service}/orgs/{org}/anomaly-detectors/validate/model:
    description: 'Validate anomaly detector configuration against OpenSearch before creation.

      '
    parameters:
    - $ref: '#/components/parameters/accept_language_optional'
    - $ref: '#/components/parameters/analytics-service'
    - $ref: '#/components/parameters/org'
    post:
      summary: Validate anomaly detector configuration
      description: Runs a pre-flight check using the OpenSearch Anomaly Detection _validate/model endpoint. Returns validation errors without creating a detector.
      operationId: anomaly_detectors_orgValidate
      security:
      - oauth:
        - engagement:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyDetectorRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/AnomalyDetectorRequest'
      responses:
        '200':
          description: Validation result from OpenSearch
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Engagement
  /{analytics-service}/orgs/{org}/anomaly-detectors/{detector-id}:
    description: 'Retrieve, update, or delete a single anomaly detector.

      '
