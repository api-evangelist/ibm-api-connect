openapi: 3.2.0
info:
  title: Ibm Api Connect My Resources API
  version: 2.0.0
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
  termsOfService: https://www.ibm.com/legal
  x-refined-note:
  - x-ibm-name differs across the merged source definitions and was not carried
  description: 'Operations tagged My Resources across 3 of this provider''s published API definitions: ibm-api-connect-cloud-management-api-openapi.yml, ibm-api-connect-consumer-api-openapi.yml, ibm-api-connect-management-api-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: My Resources
paths:
  /me:
    description: Me object operations
    get:
      summary: Returns the current user
      description: Returns the user profile for the currently authenticated user.
      operationId: me_singletonGet
      security:
      - oauth:
        - my:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/context'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Me'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - My Resources
    put:
      summary: Updates the current user
      description: 'Updates the user profile for the currently authenticated user.


        Fields allowed but ignored:

        - name

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: me_singletonUpdate
      security:
      - oauth:
        - my:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Me'
            examples:
              Me:
                summary: Example of me update.
                value:
                  email: acmesteve@example.com
                  first_name: Acme
                  last_name: Steve
          application/yaml:
            schema:
              $ref: '#/components/schemas/Me'
            examples:
              Me:
                summary: Example of me update.
                value:
                  email: acmesteve@example.com
                  first_name: Acme
                  last_name: Steve
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Me'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - My Resources
    delete:
      summary: Deletes the current user
      description: Removes the currently authenticated user.
      operationId: me_singletonDel
      security:
      - oauth:
        - my:manage
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Me'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - My Resources
    servers:
    - url: ''
      description: APIM base path
  /me/change-password:
    post:
      summary: Change my password
      operationId: me_changePassword
      security:
      - oauth:
        - my:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/yaml:
            schema:
              $ref: '#/components/schemas/ChangePassword'
            examples:
              ChangePassword:
                summary: Example of password update
                value:
                  current_password: password123
                  password: password456
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - My Resources
    servers:
    - url: ''
      description: APIM base path
  /me/reset-password:
    post:
      summary: Reset password
      operationId: me_resetPassword
      requestBody:
