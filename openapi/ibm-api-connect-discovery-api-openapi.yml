openapi: 3.2.0
info:
  x-ibm-name: discovery
  version: 2.0.0
  title: IBM API Connect Discovery API
  description: This API provides operations for accessing the API Discovery capabilities.
  termsOfService: https://www.ibm.com/legal
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
servers:
- url: ''
  description: Local laptop testing
tags:
- name: Discovery
paths:
  /orgs/{org}/discovered-apis:
    description: Discovered API operations across all collections
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Create a Discovered API object
      description: 'Create a Discovered API object


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: discovered_api_create
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveredAPI'
          application/yaml:
            schema:
              $ref: '#/components/schemas/DiscoveredAPI'
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
    get:
      summary: List all Discovered API objects in all collections
      operationId: discovered_api_listAll
      security:
      - oauth:
        - org:view
        - api-drafts:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/api_ids'
      - $ref: '#/components/parameters/document_specification'
      - $ref: '#/components/parameters/show_hidden'
      - $ref: '#/components/parameters/source'
      - $ref: '#/components/parameters/source_type'
      - $ref: '#/components/parameters/state'
      - $ref: '#/components/parameters/search_filter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPIList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPIList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
    delete:
      summary: Clear all Discovered API objects in all collections
      operationId: discovered_api_clearAll
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/{discovered-api-name}:
    description: The collection of Discovered API operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/discovered-api-name'
    get:
      summary: List the Discovered API objects
      operationId: discovered_api_list
      security:
      - oauth:
        - org:view
        - api-drafts:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/document_specification'
      - $ref: '#/components/parameters/show_hidden'
      - $ref: '#/components/parameters/source'
      - $ref: '#/components/parameters/state'
      - $ref: '#/components/parameters/search_filter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPIList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPIList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
    delete:
      summary: Clear the Discovered API objects
      operationId: discovered_api_clear
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/{discovered-api-id}:
    description: Discovered API object operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/discovered-api-id'
    get:
      summary: Get the Discovered API object by id
      operationId: discovered_api_get
      security:
      - oauth:
        - org:view
        - api-drafts:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
    patch:
      summary: Update the Discovered API object by id
      description: 'Update the Discovered API object by id


        Fields not allowed:

        - name


        Fields allowed but ignored:

        - title

        - version

        - api_type

        - document_specification

        - info

        - servers

        - paths

        - base_paths

        - host

        - schemes

        - tags

        - promotion_events

        - source

        - source_type

        - original_format

        - generated_url

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: discovered_api_update
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveredAPI'
          application/yaml:
            schema:
              $ref: '#/components/schemas/DiscoveredAPI'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
    delete:
      summary: Delete the Discovered API object by id
      operationId: discovered_api_del
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/{discovered-api-name}/{discovered-api-version}:
    description: Discovered API object operations by name and version
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/discovered-api-name'
    - $ref: '#/components/parameters/discovered-api-version'
    get:
      summary: Get the Discovered API object by name and version
      operationId: discovered_api_getByNameVersion
      security:
      - oauth:
        - org:view
        - api-drafts:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
    patch:
      summary: Update the Discovered API object by name and version
      description: 'Update the Discovered API object by name and version


        Fields not allowed:

        - name


        Fields allowed but ignored:

        - title

        - version

        - api_type

        - document_specification

        - info

        - servers

        - paths

        - base_paths

        - host

        - schemes

        - tags

        - promotion_events

        - source

        - source_type

        - original_format

        - generated_url

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: discovered_api_updateByNameVersion
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveredAPI'
          application/yaml:
            schema:
              $ref: '#/components/schemas/DiscoveredAPI'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
    delete:
      summary: Delete a Discovered API
      operationId: discovered_api_delByNameVersion
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPI'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/{discovered-api-id}/promote:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/discovered-api-id'
    put:
      summary: Copy a Discovered API to API Manager as a Draft API
      operationId: discovered_api_promote
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      parameters:
      - $ref: '#/components/parameters/promotion_title'
      - $ref: '#/components/parameters/promotion_version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResult'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PromotionResult'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/{discovered-api-name}/{discovered-api-version}/promote:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/discovered-api-name'
    - $ref: '#/components/parameters/discovered-api-version'
    put:
      summary: Copy a Discovered API to API Manager as a Draft API by name and version
      operationId: discovered_api_promoteByNameVersion
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      parameters:
      - $ref: '#/components/parameters/promotion_title'
      - $ref: '#/components/parameters/promotion_version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResult'
            application/yaml:
              schema:
                $ref: '#/components/schemas/PromotionResult'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/bulk:
    description: Discovered API operations across all collections
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Create Discovered API objects from a zip file
      description: Create each Discovered API object found in the archive of a zip of Discovered API objects
      operationId: discovered_api_bulkCreate
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiscoveredAPIMultipartRequest'
      responses:
        '201':
          description: Successful bulk create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateResults'
            application/yaml:
              schema:
                $ref: '#/components/schemas/BulkCreateResults'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/bulk/delete:
    parameters:
    - $ref: '#/components/parameters/org'
    delete:
      summary: Bulk Delete Discovered APIs by id
      operationId: discovered_api_bulkDelete
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      parameters:
      - $ref: '#/components/parameters/apis_selected'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResults'
            application/yaml:
              schema:
                $ref: '#/components/schemas/BulkResults'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/bulk/hide:
    parameters:
    - $ref: '#/components/parameters/org'
    patch:
      summary: Bulk Hide/Unhide Discovered APIs by id
      operationId: discovered_api_bulkHide
      security:
      - oauth:
        - org:manage
        - api-drafts:edit
      parameters:
      - $ref: '#/components/parameters/hidden'
      - $ref: '#/components/parameters/apis_selected'
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResults'
            application/yaml:
              schema:
                $ref: '#/components/schemas/BulkResults'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
  /orgs/{org}/discovered-apis/filters:
    parameters:
    - $ref: '#/components/parameters/org'
    get:
      summary: Get filters for Discovered APIs
      operationId: discovered_api_getFilters
      security:
      - oauth:
        - org:view
        - api-drafts:view
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPIFiltersResult'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DiscoveredAPIFiltersResult'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Discovery
components:
  parameters:
    apis_selected:
      name: apis_selected
      in: query
      description: Ids of Discovered APIs selected for bulk operations
      required: true
      schema:
        type: string
    discovered-api-id:
      name: discovered-api-id
      in: path
      description: Discovered API name
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
    discovered-api-name:
      name: discovered-api-name
      in: path
      description: Discovered API name
      required: true
      schema:
        type: string
    state:
      name: state
      in: query
      description: Optional state to use to filter Discovered API lists
      required: false
      schema:
        type: string
    org:
      name: org
      in: path
      description: Organization name or id
      required: true
      schema:
        type: string
    fields:
      name: fields
      in: query
      description: List of field names to return
      required: false
      schema:
        type: string
    show_hidden:
      name: show_hidden
      in: query
      description: Include results of hidden APIs or only return APIs that are not hidden
      required: false
      schema:
        type: boolean
    document_specification:
      name: document_specification
      in: query
      description: Optional document specification (type) to use to filter Discovered API lists
      required: false
      schema:
        type: string
    promotion_title:
      name: promotion_title
      in: query
      description: Optional custom name to be used for promotion to Draft API
      required: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: Offset item number from list to begin return
      required: false
      schema:
        type: integer
    promotion_version:
      name: promotion_version
      in: query
      description: Optional custom version to be used for promotion to Draft API
      required: false
      schema:
        type: string
    api_ids:
      name: api_ids
      in: query
      description: Ids of Discovered APIs selected for bulk download
      required: false
      schema:
        type: string
    source_type:
      name: source_type
      in: query
      description: Optional source type to use to filter Discovered API lists (static or dynamic)
      required: false
      schema:
        type: string
    hidden:
      name: hidden
      in: query
      description: Select to Hide or unhide the provided Discovered APIs
      required: true
      schema:
        type: boolean
    confirm:
      name: confirm
      in: query
      description: Confirmation for critical updates
      required: true
      schema:
        type: string
    source:
      name: source
      in: query
      description: Optional source to use to filter Discovered API lists
      required: false
      schema:
        type: string
    discovered-api-version:
      name: discovered-api-version
      in: path
      description: Discovered API version name
      required: true
      schema:
        type: string
    search_filter:
      name: search_filter
      in: query
      description: Optional search of Discovered APIs that contain provided values of their properties
      required: false
      schema:
        type: string
  schemas:
    DiscoveredAPIFilterValue:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        title:
          type: string
        count:
          type: integer
    OpenApiOperationDefinition:
      type: object
      additionalProperties: true
      required:
      - method
      properties:
        method:
          type: string
        description:
          type: string
        summary:
          type: string
        operation_id:
          type: string
        tags:
          type: array
          items:
            type: string
    BulkResults:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredAPI'
    OpenApiTagDefinition:
      type: object
      additionalProperties: true
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    DiscoveredAPI:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - discovered_api
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        description:
          type: string
          maxLength: 65535
        hidden:
          type: boolean
        state:
          type: string
          enum:
          - discovered
          - copied
        api:
          type: object
          additionalProperties: true
        info:
          type: object
          additionalProperties: true
          required:
          - title
          - version
          properties:
            title:
              type: string
            version:
              type: string
        api_type:
          type: string
          enum:
          - rest
          - graphql
          - asyncapi
        document_specification:
          type: string
          enum:
          - asyncapi2.0
          - asyncapi2.1
          - openapi2
          - openapi3
        base_paths:
          type: array
          items:
            type: string
        host:
          type: string
        schemes:
          type: array
          items:
            type: string
        servers:
          type: array
          items:
            $ref: '#/components/schemas/OpenApi3ServerDefinition'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/OpenApiPathDefinition'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/OpenApiTagDefinition'
        original_format:
          type: string
          enum:
          - json
          - yaml
        data_source:
          type: object
          additionalProperties: false
          properties:
            source:
              type: string
            collector_type:
              type: string
            source_address:
              type: string
            source_id:
              type: string
            options:
              type: object
              additionalProperties: true
        source:
          type: string
        source_type:
          type: string
        promotion_events:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredAPIPromotionEvent'
        generated_url:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
          format: uri
    PromotionResult:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
        draft_api:
          type: object
          additionalProperties: true
          properties:
            swagger:
              type: string
            info:
              type: object
              additionalProperties: true
              required:
              - title
              - version
              properties:
                title:
                  type: string
                version:
                  type: string
    DiscoveredAPIFilter:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        title:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredAPIFilterValue'
    DiscoveredAPIPromotionEvent:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        title:
          type: string
        version:
          type: string
        copied_at:
          type: string
          format: date-time
          readOnly: true
        reference:
          type: string
          format: uri
    DiscoveredAPIList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredAPI'
    OpenApi3ServerDefinition:
      type: object
      additionalProperties: true
      properties:
        url:
          type: string
          format: uri
        server_address:
          type: string
          format: uri
        description:
          type: string
    OpenApiPathDefinition:
      type: object
      additionalProperties: true
      properties:
        path:
          type: string
        description:
          type: string
        summary:
          type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OpenApiOperationDefinition'
    DiscoveredAPIMultipartRequest:
      type: object
      additionalProperties: false
      properties:
        discovered_api_objects:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredAPI'
    DiscoveredAPIFiltersResult:
      type: object
      additionalProperties: false
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredAPIFilter'
    BulkCreateResults:
      type: object
      additionalProperties: false
