      description: 'Update the Programming Package object by name and version


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url'
      operationId: programming_package_updateByNameVersion
      security:
      - oauth:
        - org:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgrammingPackage'
            examples:
              ProgrammingPackage:
                summary: Example for programming package update by name and version
                value:
                  name: acme-programming-package
                  version: 1.0.0
                  title: ACME Programming Package
                  summary: Updated programming package for ACME org
                  programming_package_type: lua
                  programming_package_files:
                  - file_path: programming-packages/acme-module.lua
                    mimetype: text/x-lua
          application/yaml:
            schema:
              $ref: '#/components/schemas/ProgrammingPackage'
            examples:
              ProgrammingPackage:
                summary: Example for programming package update by name and version
                value:
                  name: acme-programming-package
                  version: 1.0.0
                  title: ACME Programming Package
                  summary: Updated programming package for ACME org
                  programming_package_type: lua
                  programming_package_files:
                  - file_path: programming-packages/acme-module.lua
                    mimetype: text/x-lua
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProgrammingPackageMultipart'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgrammingPackage'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProgrammingPackage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Organization Resources
    delete:
      summary: Delete a Programming Package
      operationId: programming_package_delByNameVersion
      security:
      - oauth:
        - org:manage
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgrammingPackage'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProgrammingPackage'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Organization Resources
    servers:
    - url: ''
      description: APIM base path
