                $ref: '#/components/schemas/NotificationStyle'
            application/yaml:
              schema:
                $ref: '#/components/schemas/NotificationStyle'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Catalog Settings
    put:
      summary: Update the Notification Style object
      description: 'Update the Notification Style object


