openapi: 3.2.0
info:
  x-ibm-name: apim
  version: 2.0.0
  title: IBM API Connect Platform - Provider Application Strategy…
  description: This API provides operations for accessing API provider capability.
  termsOfService: https://www.ibm.com/legal
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
