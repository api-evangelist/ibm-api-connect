paths:
  /orgs/{org}/apps:
    description: The collection of Application operations
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Create a Application object
      description: 'Create a Application object


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url'
      operationId: app_create
      security:
      - oauth:
        - app:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/App'
          application/yaml:
            schema:
              $ref: '#/components/schemas/App'
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
            application/yaml:
              schema:
                $ref: '#/components/schemas/App'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Organization Application
    get:
      summary: List the Application objects
      operationId: app_list
      security:
      - oauth:
        - app:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
