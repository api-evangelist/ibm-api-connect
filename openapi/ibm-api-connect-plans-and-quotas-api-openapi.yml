components:
  schemas:
    ProjectMetadata:
      description: Defines a message named Metadata
      type: object
      required:
      - name
      - version
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        namespace:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          enum:
          - REST
          - SWAGGER
          - SOAP
          - GRAPHQL
          - ODATA
          type: string
        version:
          type: string
        domain:
          enum:
          - api
          - ai-platform
          - mcp
          type: string
        labels:
          type: object
          additionalProperties: true
          properties:
            gatewayTypes:
              type: array
              items:
                type: string
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    ProjectQuota:
      type: object
      required:
      - kind
      - apiVersion
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
        kind:
          enum:
          - Quota
          type: string
        metadata:
          $ref: '#/components/schemas/ProjectMetadata'
        spec:
          type: object
          properties:
            maxRequest:
              type: integer
              description: Size of the rate limit bucket
            interval:
              type: string
              description: Time interval for the rate limit (e.g., 1s, 1m, 1h)
            extensions:
              type: object
              properties:
                dp-gateway:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    spec:
                      type: object
                      properties:
                        onLimitReach:
                          type: string
                          enum:
                          - block
                          - allow
                dp-nano-gateway:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    spec:
                      type: object
                      properties:
                        weightExpr:
                          type: string
                          description: Optional dynamic string expression
                        exceedAction:
                          type: string
                          enum:
                          - continue
                          - return429
                          - return500
                        intervalOffset:
                          type: integer
                        dynamicValue:
                          type: string
                          description: Optional dynamic key expression
                webm-gateway:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    spec:
                      type: object
                      properties:
                        alertMessage:
                          type: string
                        alertFrequency:
                          type: string
                          enum:
                          - always
                          - once
                        onLimitReach:
                          type: string
                          enum:
                          - block
                          - allow
                        notification:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                            notifyAfter:
                              type: string
                            message:
                              type: string
                            email:
                              type: array
                              items:
                                type: string
                            customDestination:
                              type: array
                              items:
                                type: string
    PlanList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    QuotaList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Quota'
    ProjectPlan:
      type: object
      required:
      - kind
      - apiVersion
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
        kind:
          enum:
          - Plan
          type: string
        metadata:
          $ref: '#/components/schemas/ProjectMetadata'
        spec:
          type: object
          properties:
            termsOfService:
              type: string
            license:
              type: string
            qos:
              type: object
              required:
              - withQuota
              properties:
                withQuota:
                  type: object
                  properties:
                    unlimited:
                      type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      required:
                      - $ref
                      properties:
                        $ref:
                          type: string
            extensions:
              type: object
              properties:
                webm-gateway:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    spec:
                      type: object
                      properties:
                        pricing:
                          type: object
                          properties:
                            value:
                              type: number
                            currency:
                              type: string
                          required:
                          - value
                          - currency
                        withRateLimit:
                          type: array
                          items:
                            type: object
                            properties:
                              maxRequest:
                                type: integer
                              interval:
                                type: string
                              alertMessage:
                                type: string
                              alertFrequency:
                                type: string
                              name:
                                type: string
                            required:
                            - maxRequest
                            - interval
                            - name
                dp-nano-gateway:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    spec:
                      type: object
                      properties:
                        isApprovalRequired:
                          type: boolean
                        apis:
                          type: array
                          items:
                            type: object
                            properties:
                              $ref:
                                type: string
                              operations:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                    path:
                                      type: string
                                    method:
                                      type: string
                                    withQuota:
                                      oneOf:
                                      - type: object
                                        additionalProperties:
                                          type: array
                                          items:
                                            type: object
                                            required:
                                            - $ref
                                            properties:
                                              $ref:
                                                type: string
                                      - type: object
                                        additionalProperties: false
                                        required:
                                        - unlimited
                                        properties:
                                          unlimited:
                                            type: object
                            required:
                            - $ref
                        withAssemblyCountLimit:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: object
                              required:
                              - $ref
                              properties:
                                $ref:
                                  type: string
                        properties:
                          type: object
                          additionalProperties:
                            type: string
                          description: Arbitrary key-value pairs for custom properties
                        telemetry:
                          type: object
                          additionalProperties:
                            type: string
                dp-gateway:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    spec:
                      type: object
                      properties:
                        isApprovalRequired:
                          type: boolean
                        withRateLimit:
                          type: array
                          items:
                            type: object
                            properties:
                              maxRequest:
                                type: integer
                              interval:
                                type: string
                              name:
                                type: string
                            required:
                            - maxRequest
                            - interval
                            - name
                        withAssemblyCountLimit:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              maxRequest:
                                oneOf:
                                - type: integer
                                - type: string
                              hard-limit:
                                type: boolean
                              cache-only:
                                type: boolean
                              is-client:
                                type: boolean
                              use-api-name:
                                type: boolean
                              use-app-id:
                                type: boolean
                              use-client-id:
                                type: boolean
                              dynamic-value:
                                type: string
                              weight:
                                type: string
                                pattern: .+
                              auto-decrement:
                                type: boolean
                            required:
                            - name
                            - maxRequest
                        withAssemblyRateLimit:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              maxRequest:
                                type: integer
                              interval:
                                type: string
                              cache-only:
                                type: boolean
                              is-client:
                                type: boolean
                              use-api-name:
                                type: boolean
                              use-app-id:
                                type: boolean
                              use-client-id:
                                type: boolean
                              dynamic-value:
                                type: string
                              weight:
                                type: string
                                pattern: .+
                            required:
                            - name
                            - maxRequest
                            - interval
                        withAssemblyQuotaLimit:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              maxRequest:
                                type: integer
                              interval:
                                type: string
                              hard-limit:
                                type: boolean
                              cache-only:
                                type: boolean
                              is-client:
                                type: boolean
                              use-api-name:
                                type: boolean
                              use-app-id:
                                type: boolean
                              use-client-id:
                                type: boolean
                              dynamic-value:
                                type: string
                              weight:
                                type: string
                                pattern: .+
                            required:
                            - name
                            - maxRequest
                            - interval
                        apis:
                          type: array
                          items:
                            type: object
                            properties:
                              $ref:
                                type: string
                              operations:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    path:
                                      type: string
                                    method:
                                      type: string
                                    withQuota:
                                      oneOf:
