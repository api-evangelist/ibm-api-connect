# Coverage demoted 2026-10-07 (roadmap#942, PLAN.md Stage A): this file was written by an API Evangelist
# sweep and names no billing unit, meters or pricing category read from the provider — it restates the
# FinOps framework. It is `x-coverage: unmeasured`, and the FOCUS alignment it claimed has been removed.
x-coverage: unmeasured
specification: FinOps Framework
specificationVersion: '1.0'
provider: IBM API Connect
providerId: ibm-api-connect
publisherName: IBM API Connect
serviceCategory: API
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-10-10'
tags:
  - API Gateway
  - API Management
  - Developer Portal
  - IBM
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the IBM API Connect API surface. Provides a FOCUS-aligned
  mapping for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  # Read from IBM's pricing page and subscription terms (2026-10-10): hosted plans are
  # metered on gateway API calls, sold in increments of 100,000 calls, billed through
  # AWS Marketplace or IBM; annual contracts (Standard, Premium, Reserved Instance) or
  # monthly usage (Pay-As-You-Go). No overage is charged. Software is licensed with
  # annual Subscription and Support.
  x-sources:
    - https://www.ibm.com/products/api-connect/pricing
    - https://www.ibm.com/docs/en/api-connect/cloud/12.1.1_saas?topic=overview-purchase-subscription-upgrade-information
  pricingCategory: Usage-Based
  pricingUnit: API call
  pricingIncrement: 100000
  overage: none
  billingFrequency: Annual or monthly (Pay-As-You-Go)
  billingChannels:
    - AWS Marketplace
    - IBM Marketplace
    - IBM Sales
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: IBM API Connect
  ServiceCategory: Developer Tools / API
  ProviderName: IBM API Connect
  PublisherName: IBM API Connect
  InvoiceIssuerName: IBM API Connect
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: IBM API Connect Platform - Cloud Management API
    serviceName: IBM API Connect Platform - Cloud Management API
    serviceCategory: API
  - name: IBM API Connect Platform - Provider API
    serviceName: IBM API Connect Platform - Provider API
    serviceCategory: API
  - name: IBM API Connect Platform - Consumer API
    serviceName: IBM API Connect Platform - Consumer API
    serviceCategory: API
  - name: IBM API Connect Analytics API
    serviceName: IBM API Connect Analytics API
    serviceCategory: API
  - name: IBM API Connect Consumer Analytics API
    serviceName: IBM API Connect Consumer Analytics API
    serviceCategory: API
  - name: IBM API Connect Engagement API
    serviceName: IBM API Connect Engagement API
    serviceCategory: API
  - name: API Connect Portal Admin API
    serviceName: API Connect Portal Admin API
    serviceCategory: API
  - name: IBM API Connect Discovery API
    serviceName: IBM API Connect Discovery API
    serviceCategory: API
  - name: IBM API Connect Governance API
    serviceName: IBM API Connect Governance API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
