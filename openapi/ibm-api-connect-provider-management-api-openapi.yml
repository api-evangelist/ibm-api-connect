paths:
  /cloud/org-invitations:
    description: The collection of Organization Invitation operations
    post:
      summary: Create an Organization Invitation object
      description: 'Create an Organization Invitation object


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url

        - catalog_url

        - space_url'
      operationId: invitation_createOrgScope
      security:
      - oauth:
        - provider-org:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invitation'
            examples:
              Invitation:
                summary: Example of invitation creation at org scope.
                value:
                  name: acme-invitation
                  title: Acme invitation
                  summary: An example invitation creation at org scope
                  notify: true
                  email: acme@example.com
          application/yaml:
            schema:
              $ref: '#/components/schemas/Invitation'
            examples:
              Invitation:
                summary: Example of invitation creation at org scope.
                value:
                  name: acme-invitation
                  title: Acme invitation
                  summary: An example invitation creation at org scope
                  notify: true
                  email: acme@example.com
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Invitation'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Provider Management
    get:
      summary: List the Organization Invitation objects
      operationId: invitation_listOrgScope
      security:
      - oauth:
        - provider-org:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/InvitationList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Provider Management
    delete:
      summary: Clear the Organization Invitation objects
