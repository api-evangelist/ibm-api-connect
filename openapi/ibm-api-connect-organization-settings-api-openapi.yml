openapi: 3.2.0
info:
  title: Ibm Api Connect Organization Settings API
  version: 2.0.0
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
  termsOfService: https://www.ibm.com/legal
  x-ibm-name: apim
  description: 'Operations tagged Organization Settings across 2 of this provider''s published API definitions: ibm-api-connect-cloud-management-api-openapi.yml, ibm-api-connect-management-api-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Organization Settings
paths:
  /orgs/{org}/settings:
    description: Organization Setting object operations
    parameters:
    - $ref: '#/components/parameters/org'
    get:
      summary: Returns provider organization settings
      description: Returns the settings for a provider organization.
      operationId: org_setting_singletonGet
      security:
      - oauth:
        - org:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSetting'
            application/yaml:
              schema:
                $ref: '#/components/schemas/OrgSetting'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Organization Settings
    put:
      summary: Updates provider organization settings
      description: 'Updates the settings for a provider organization.


        Fields allowed but ignored:

        - name

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: org_setting_singletonUpdate
      security:
      - oauth:
        - org:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSetting'
            examples:
              OrgSetting:
                summary: Example of fields which can be updated on a org settings object.
                value:
                  title: Updated ACME org settings
                  invitation_ttl: 172500
                  custom_notification_templates_enabled: true
                  email_sender:
                    custom: true
                    name: ACME Mail
                    address: acme-mail@example.com
          application/yaml:
            schema:
              $ref: '#/components/schemas/OrgSetting'
            examples:
              OrgSetting:
                summary: Example of fields which can be updated on a org settings object.
                value:
                  title: Updated ACME org settings
                  invitation_ttl: 172500
                  custom_notification_templates_enabled: true
                  email_sender:
                    custom: true
                    name: ACME Mail
                    address: acme-mail@example.com
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSetting'
            application/yaml:
              schema:
                $ref: '#/components/schemas/OrgSetting'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Organization Settings
    servers:
    - url: ''
      description: APIM base path
  /orgs/{org}/settings/notification-templates:
    description: Notification Template operations across all collections
    parameters:
    - $ref: '#/components/parameters/org'
    get:
      summary: Lists provider notification templates
      description: Returns the list of all notification templates for a provider organization.
      operationId: notification_template_listAllOrgScope
