specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: IBM API Connect
providerId: ibm-api-connect
created: '2026-05-04'
# Rewritten 2026-10-10 from IBM's published pricing page and the API Connect
# Enterprise as a Service subscription terms, replacing the 2026-05-04 sweep
# scaffold (whose Free/Professional/Enterprise tiers and limits were defaults).
method: searched
modified: '2026-10-10'
source:
  - https://www.ibm.com/products/api-connect/pricing
  - https://www.ibm.com/docs/en/api-connect/cloud/12.1.1_saas?topic=overview-purchase-subscription-upgrade-information
tags:
  - API Gateway
  - API Management
  - Developer Portal
  - IBM
description: >-
  IBM API Connect is sold as a hosted service on AWS (Pay-As-You-Go, Standard and
  Premium), as a single-tenant Reserved Instance on IBM Cloud, or as self-managed
  Software. Hosted plans are metered on API calls through the gateway, counted for
  every response code; IBM charges no overage and stops calls once a contract's limit
  is reached (105% of the purchased volume for Standard). Prices are quoted by IBM,
  vary by country and are not reproduced here; the pricing page has an estimator.
plans:
  - id: ibm-api-connect-trial
    name: Trial
    type: trial
    description: >-
      30-day free trial of API Connect Enterprise as a Service: one service instance
      and up to 100,000 API calls, with Standard features. Community support only.
      Assets are retained for a 30-day suspension period after the trial so it can be
      upgraded in place.
    entries:
      - label: API Calls
        description: Total API calls allowed during the trial; all response codes count
        name: api_calls
        type: quota
        metric: requests
        limit: 100000
        timeFrame: trial
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Trial Period
        description: Length of the free trial
        name: trial_period
        type: duration
        metric: days
        limit: 30
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Single Service Instance
      - name: Standard Features
      - name: Community Support
    links:
      - type: Signup
        url: https://www.ibm.com/account/reg/signup?formid=urx-53961
  - id: ibm-api-connect-pay-as-you-go
    name: Pay-As-You-Go
    type: metered
    description: >-
      Usage-based pricing on AWS with no upfront cost; pay only for API calls consumed
      and cancel at any time. Multi-tenant, one instance, 30-day analytics retention,
      99.9% SLA.
    entries:
      - label: API Calls
        description: Metered API call volume
        name: api_calls
        type: metered
        metric: requests
        limit: -1
        timeFrame: month
        unit: 1
        price: quote
        userMultiplied: false
    elements:
      - name: Multi-Tenant Hosting on AWS
      - name: Single Service Instance
      - name: Developer Portal
      - name: 30-Day Analytics Retention
      - name: 24x7 Support
      - name: 99.9% SLA
  - id: ibm-api-connect-standard
    name: Standard
    type: paid
    description: >-
      Annual multi-tenant subscription hosted on AWS, sold in increments of 100,000 API
      calls per year up to 1.2 billion on AWS Marketplace (higher through IBM sales).
      Up to 3 service instances, dedicated support, 90-day analytics retention and a
      99.9% SLA. Contracts run 1, 2 or 3 years.
    entries:
      - label: API Calls
        description: >-
          Contracted API calls per year across all instances; calls stop at 105% of the
          purchased volume unless upgraded. Unused calls do not roll over.
        name: api_calls
        type: quota
        metric: requests
        limit: 1200000000
        timeFrame: year
        unit: 100000
        price: quote
        userMultiplied: false
    elements:
      - name: Up to 3 Service Instances
      - name: Developer Portal
      - name: 90-Day Analytics Retention
      - name: Dedicated Support Team
      - name: 99.9% SLA
  - id: ibm-api-connect-premium
    name: Premium
    type: paid
    description: >-
      Annual subscription on AWS with all Standard features plus advanced data
      transformation policies (XSLT, GatewayScript and custom policies), a highly
      available single-tenant gateway managed by IBM, and remote gateways in catalogs.
      Minimum 100 million API calls per year.
    entries:
      - label: API Calls
        description: Contracted API calls per year, from 100 million to 1.2 billion
        name: api_calls
        type: quota
        metric: requests
        limit: 1200000000
        timeFrame: year
        unit: 100000
        price: quote
        userMultiplied: false
    elements:
      - name: All Standard Features
      - name: Up to 3 Service Instances
      - name: Single-Tenant Managed Gateway
      - name: Advanced Transformation Policies
      - name: Remote Gateways
      - name: 99.9% SLA
  - id: ibm-api-connect-reserved-instance
    name: Reserved Instance
    type: enterprise
    description: >-
      Annual single-tenant service hosted on IBM Cloud for greater isolation and
      availability, from 120 million API calls per year, with an SLA of up to 99.95%.
    entries:
      - label: API Calls
        description: Contracted API calls per year (120 million and above)
        name: api_calls
        type: quota
        metric: requests
        limit: -1
        timeFrame: year
        unit: 1
        price: quote
        userMultiplied: false
    elements:
      - name: Single-Tenant Hosting on IBM Cloud

      - name: 90-Day Analytics Retention
      - name: Up to 99.95% SLA
  - id: ibm-api-connect-software
    name: Software
    type: enterprise
    description: >-
      Self-managed deployment on premises, in hybrid or multi-cloud environments, with
      IBM Software Subscription and Support renewed annually. DataPower API Gateway,
      DataPower Nano Gateway and webMethods API Gateway are available. Volume and SLA
      are customer determined.
    entries: []
    elements:
      - name: Self-Managed Deployment
      - name: DataPower API Gateway
      - name: DataPower Nano Gateway
      - name: webMethods API Gateway
      - name: Developer Portal
      - name: 24x7 Support
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
