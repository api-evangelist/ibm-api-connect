components:
  parameters:
    generated-api-id:
      name: generated-api-id
      in: path
      description: Generated API name
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
    generate_apis:
      name: generate_apis
      in: query
      description: Optional flag that, if set to true will disable the generation of APIs when API Call records are sent
      required: false
      schema:
        type: boolean
    fields:
      name: fields
      in: query
      description: List of field names to return
      required: false
      schema:
        type: string
    org:
      name: org
      in: path
      description: Organization name or id
      required: true
      schema:
        type: string
    discovered:
      name: discovered
      in: query
      description: Optional flag to automatically create a Discovered API from a Generated API if true
      required: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: Offset item number from list to begin return
      required: false
      schema:
        type: integer
    openapi_version:
      name: openapi_version
      in: query
      description: OpenAPI version to be used in generated Document
      required: false
      schema:
        type: string
    sensitivity:
      name: sensitivity
      in: query
      description: Optional sensitivity for path parameter detection
      required: false
      schema:
        type: string
    confirm:
      name: confirm
      in: query
      description: Confirmation for critical updates
      required: true
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version to be used for generated OpenAPI Document
      required: false
      schema:
        type: string
    title:
      name: title
      in: query
      description: Title to be used for generated OpenAPI Document
      required: false
      schema:
        type: string
    generated-api-version:
      name: generated-api-version
      in: path
      description: Generated API version name
      required: true
      schema:
        type: string
    basepath:
      name: basepath
      in: query
      description: Basepath to be used for generated OpenAPI 2 Document
      required: false
      schema:
        type: string
    source:
      name: source
      in: query
      description: Optional source to use to filter Discovered API lists
      required: false
      schema:
        type: string
    generated-api-name:
      name: generated-api-name
      in: path
      description: Generated API name
      required: true
      schema:
        type: string
    autodiscover:
      name: autodiscover
      in: query
      description: Optional flag that will automatically create a Discovered API from a Generated API if true
      required: false
      schema:
        type: boolean
  schemas:
    OpenApiOperationDefinition:
      type: object
      additionalProperties: true
      required:
      - method
      properties:
        method:
          type: string
        description:
          type: string
        summary:
          type: string
        operation_id:
          type: string
        tags:
          type: array
          items:
            type: string
    GeneratedAPI:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - generated_api
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        api:
          type: object
          additionalProperties: true
          properties:
            swagger:
              type: string
            info:
              type: object
              additionalProperties: true
              required:
              - title
              - version
              properties:
                title:
                  type: string
                x-ibm-name:
                  type: string
                version:
                  type: string
                x-ibm-summary:
                  type: string
        api_type:
          type: string
          enum:
          - rest
          - wsdl
          - graphql
          - asyncapi
        oai_version:
          type: string
          enum:
          - openapi2
          - openapi3
        document_specification:
          type: string
          enum:
          - asyncapi2.0
          - asyncapi2.1
          - openapi2
          - openapi3
        data_source:
          type: object
          additionalProperties: false
          properties:
            source:
              type: string
            collector_type:
              type: string
            source_address:
              type: string
            source_id:
              type: string
            options:
              type: object
              additionalProperties: true
        source:
          type: string
        source_type:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
          format: uri
    OpenApiTagDefinition:
      type: object
      additionalProperties: true
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: array
          items:
            type: string
        errors:
