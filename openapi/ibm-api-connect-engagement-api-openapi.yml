          type: string
          description: AWS topic ARN (only used for SNS destinations)
        role_arn:
          type: string
          description: AWS role ARN (optional and only used for SNS destinations)
        service_address:
          type: string
          x-bhendi-no-ref-rewrite: true
          description: Service API address (used for ILMT and IWHI metering destinations)
        api_key:
          type: string
          description: API key for authentication (only used for IWHI metering destinations)
        jira_host:
          type: string
          x-bhendi-no-ref-rewrite: true
          description: Jira host URL (only used for Jira destinations)
        project_key:
          type: string
          description: Jira project key (only used for Jira destinations)
          example: OPS
        issue_type:
          type: string
          description: Jira issue type (only used for Jira destinations)
          example: Bug
        username:
          type: string
          description: Jira account username / email address (only used for Jira destinations)
          example: user@example.com
        api_token:
          type: string
          writeOnly: true
          description: Jira API token for authentication (only used for Jira destinations)
          example: ATATT3xFfGF09_EXAMPLE
        webhook:
          type: object
          properties:
            target:
              type: string
              description: HTTP(S) URL for webhook destinations (only used for webhook destinations)
            header_params:
              type: object
              description: HTTP header parameters for webhook destinations (only used for webhook destinations)
            method:
              type: string
              description: HTTP method for webhook destinations (only used for webhook destinations)
              enum:
              - POST
              - PUT
              - PATCH
