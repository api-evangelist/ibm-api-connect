openapi: 3.2.0
info:
  x-ibm-name: apim
  version: 2.0.0
  title: IBM API Connect Platform - Provider Project API
  description: This API provides operations for accessing API provider capability.
  termsOfService: https://www.ibm.com/legal
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
servers:
- url: ''
  description: APIM base path
tags:
- name: Project
paths:
  /orgs/{org}/projects:
    description: The collection of Project operations
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Create a Project object
      description: 'Create a Project object


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url'
      operationId: project_create
      security:
      - oauth:
        - project:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
            examples:
              Project:
                summary: Example for project create
                value:
                  name: SampleProject
                  title: My Sample API Project update title
                  summary: A sample project for demonstrating the project create command
          application/yaml:
            schema:
              $ref: '#/components/schemas/Project'
            examples:
              Project:
                summary: Example for project create
                value:
                  name: SampleProject
                  title: My Sample API Project update title
                  summary: A sample project for demonstrating the project create command
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Project'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    get:
      summary: List the Project objects
      operationId: project_list
      security:
      - oauth:
        - project:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    delete:
      summary: Clear the Project objects
      operationId: project_clear
      security:
      - oauth:
        - project:manage
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
  /orgs/{org}/projects/{project}:
    description: Project object operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/project'
    get:
      summary: Get the Project object by name or id
      operationId: project_get
      security:
      - oauth:
        - project:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Project'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    patch:
      summary: Update the Project object by name or id
      description: 'Update the Project object by name or id


        Fields not allowed:

        - name


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url'
      operationId: project_update
      security:
      - oauth:
        - project:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
            examples:
              Project:
                summary: Example for project update
                value:
                  title: My Sample API Project update title
                  summary: A sample project for demonstrating the project update command
          application/yaml:
            schema:
              $ref: '#/components/schemas/Project'
            examples:
              Project:
                summary: Example for project update
                value:
                  title: My Sample API Project update title
                  summary: A sample project for demonstrating the project update command
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Project'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    delete:
      summary: Delete the Project object by name or id
      operationId: project_del
      security:
      - oauth:
        - project:manage
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Project'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
  /orgs/{org}/project-files:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/calc_dep'
    post:
      summary: Create project with files from archive
      description: 'Create a new project and populate it with files from a zip archive.

        For adding files to an EXISTING project, use /orgs/{org}/projects/{project}/create-project-files'
      operationId: project_createProjectFilesOrgScope
      security:
      - oauth:
        - project:manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateProjectFilesOrgScopeRequest'
      responses:
        '201':
          description: Project created successfully with files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectFilesOrgScopeResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/CreateProjectFilesOrgScopeResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
  /orgs/{org}/projects/{project}/create-project-files:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/project'
    - $ref: '#/components/parameters/calc_dep'
    post:
      summary: Create a Project File object
      operationId: project_createProjectFiles
      security:
      - oauth:
        - project:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectFile'
          application/yaml:
            schema:
              $ref: '#/components/schemas/ProjectFile'
            examples:
              ProjectFile:
                summary: Example for project-files create
                value:
                  files:
                  - source_path: project/data/spec.yaml
                    file_path: SampleProject/spec.yaml
                    mimetype: application/yaml
                    version: 1.0.0
                  - source_path: project/data/datapowerassembly.yaml
                    file_path: SampleProject/datapowerassembly.yaml
                    mimetype: application/yaml
                    version: 1.0.0
                  - source_path: project/data/format.xsl
                    file_path: SampleProject/format.xsl
                    mimetype: text/plain
                    version: 1.0.0
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectFileMultipart'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFileList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFileList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
  /orgs/{org}/projects/{project}/project-files:
    description: Project File operations across all collections
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/project'
    get:
      summary: List all Project File objects in all collections
      operationId: project_file_listAll
      security:
      - oauth:
        - project:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFileList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFileList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    delete:
      summary: Clear all Project File objects in all collections
      operationId: project_file_clearAll
      security:
      - oauth:
        - project:manage
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
  /orgs/{org}/projects/{project}/project-files/{project-file-name}:
    description: The collection of Project File operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/project'
    - $ref: '#/components/parameters/project-file-name'
    get:
      summary: List the Project File objects
      operationId: project_file_list
      security:
      - oauth:
        - project:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFileList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFileList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    delete:
      summary: Clear the Project File objects
      operationId: project_file_clear
      security:
      - oauth:
        - project:manage
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
  /orgs/{org}/projects/{project}/project-files/{project-file-id}:
    description: Project File object operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/project'
    - $ref: '#/components/parameters/project-file-id'
    get:
      summary: Get the Project File object by id
      operationId: project_file_get
      security:
      - oauth:
        - project:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFile'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    patch:
      summary: Update the Project File object by id
      description: 'Update the Project File object by id


        Fields not allowed:

        - name


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: project_file_update
      security:
      - oauth:
        - project:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectFile'
            examples:
              ProjectFile:
                summary: Example for project-file update
                value:
                  source_path: project/data/datapowerassembly.yaml
                  file_path: SampleProject/datapowerassembly.yaml
                  mimetype: application/yaml
                  version: 1.0.0
          application/yaml:
            schema:
              $ref: '#/components/schemas/ProjectFile'
            examples:
              ProjectFile:
                summary: Example for project-file update
                value:
                  source_path: project/data/datapowerassembly.yaml
                  file_path: SampleProject/datapowerassembly.yaml
                  mimetype: application/yaml
                  version: 1.0.0
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectFileMultipart'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFile'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    delete:
      summary: Delete the Project File object by id
      operationId: project_file_del
      security:
      - oauth:
        - project:manage
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFile'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
  /orgs/{org}/projects/{project}/project-files/{project-file-name}/{project-file-version}:
    description: Project File object operations by name and version
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/project'
    - $ref: '#/components/parameters/project-file-name'
    - $ref: '#/components/parameters/project-file-version'
    get:
      summary: Get the Project File object by name and version
      operationId: project_file_getByNameVersion
      security:
      - oauth:
        - project:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFile'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    patch:
      summary: Update the Project File object by name and version
      description: 'Update the Project File object by name and version


        Fields not allowed:

        - name


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: project_file_updateByNameVersion
      security:
      - oauth:
        - project:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectFile'
            examples:
              ProjectFile:
                summary: Example for project-file update
                value:
                  source_path: project/data/datapowerassembly.yaml
                  file_path: SampleProject/datapowerassembly.yaml
                  mimetype: application/yaml
                  version: 1.0.0
          application/yaml:
            schema:
              $ref: '#/components/schemas/ProjectFile'
            examples:
              ProjectFile:
                summary: Example for project-file update
                value:
                  source_path: project/data/datapowerassembly.yaml
                  file_path: SampleProject/datapowerassembly.yaml
                  mimetype: application/yaml
                  version: 1.0.0
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectFileMultipart'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFile'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
    delete:
      summary: Delete a Project File
      operationId: project_file_delByNameVersion
      security:
      - oauth:
        - project:manage
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFile'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProjectFile'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
  /orgs/{org}/projects/{project}/project-files/{project-file-id}/content:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/project'
    - $ref: '#/components/parameters/project-file-id'
    get:
      summary: Get the Project File content
      operationId: project_file_content
      security:
      - oauth:
        - project:view
      responses:
        '200':
          description: Success
          content:
            application/octet-stream: {}
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Project
components:
  parameters:
    project:
      name: project
      in: path
      description: Project name or id
      required: true
      schema:
        type: string
    project-file-id:
      name: project-file-id
      in: path
      description: Project File name
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
    calc_dep:
      name: calc_dep
      in: query
      description: Calculate dependencies
      required: false
      schema:
        type: boolean
    org:
      name: org
      in: path
      description: Organization name or id
      required: true
      schema:
        type: string
    fields:
      name: fields
      in: query
      description: List of field names to return
      required: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: Offset item number from list to begin return
      required: false
      schema:
        type: integer
    project-file-name:
      name: project-file-name
      in: path
      description: Project File name
      required: true
      schema:
        type: string
    project-file-version:
      name: project-file-version
      in: path
      description: Project File version name
      required: true
      schema:
        type: string
    confirm:
      name: confirm
      in: query
      description: Confirmation for critical updates
      required: true
      schema:
        type: string
  schemas:
    ProjectList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    ProjectMetadata:
      description: Defines a message named Metadata
      type: object
      required:
      - name
      - version
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        namespace:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          enum:
          - REST
          - SWAGGER
          - SOAP
          - GRAPHQL
          - ODATA
          type: string
        version:
          type: string
        domain:
          enum:
          - api
          - ai-platform
          - mcp
          type: string
        labels:
          type: object
          additionalProperties: true
          properties:
            gatewayTypes:
              type: array
              items:
                type: string
    ProjectReferenceList:
      type: array
      items:
        $ref: '#/components/schemas/ProjectReference'
    CreateProjectFilesOrgScopeResponse:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectFile'
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    ProjectReference:
      type: object
      required:
      - $ref
      additionalProperties: false
      properties:
        $ref:
          description: Field 'ref' with JSON name '$ref' accepts the value of either 'ref' or '$ref' from the YAML file. If both 'ref' and '$ref' are specified, the value of '$ref' takes priority.
          type: string
    CreateProjectFilesOrgScopeRequest:
      type: object
      required:
      - projectName
      - archive
      properties:
        projectName:
          type: string
          description: Name of the project to create
        archive:
          type: string
          format: binary
          description: Zip archive containing project files
    ProjectDocument:
      type: object
      required:
      - kind
      - apiVersion
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
        kind:
          enum:
          - Project
          type: string
        metadata:
          $ref: '#/components/schemas/ProjectMetadata'
        spec:
          properties:
            api:
              $ref: '#/components/schemas/ProjectReferenceList'
          type: object
    ProjectFileMultipart:
      type: object
      properties:
        file:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/ProjectFile'
            - $ref: '#/components/schemas/ProjectZip'
    Project:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - project
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        project:
          $ref: '#/components/schemas/ProjectDocument'
        org_url:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
          format: uri
    ProjectZip:
      type: object
      additionalProperties: true
    ProjectFileList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectFile'
    ProjectFile:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - project_file
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        file_content:
          type: object
        file_name:
          type: string
        file_path:
          type: string
        mimetype:
          type: string
        assetNodes:
          type: array
          items:
            type: object
        assetEdges:
          type: array
          items:
            type: object
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
          format: uri
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/yaml:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /oauth2/authorize
