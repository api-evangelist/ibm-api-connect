        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - My Resources
    post:
      summary: Create a My Organization object
      description: 'Create a My Organization object


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url'
      operationId: my_org_create
      security:
      - oauth:
        - org:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Org_2'
          application/yaml:
            schema:
              $ref: '#/components/schemas/Org_2'
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org_2'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Org_2'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        '202':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - My Resources
    servers:
    - url: ''
      description: APIM base path
  /tasks:
