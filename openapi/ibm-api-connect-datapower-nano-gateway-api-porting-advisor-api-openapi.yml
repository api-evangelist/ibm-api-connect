openapi: 3.2.0
info:
  x-ibm-name: apim
  version: 2.0.0
  title: IBM API Connect Platform - Provider DataPower Nano Gateway…
  description: This API provides operations for accessing API provider capability.
  termsOfService: https://www.ibm.com/legal
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
servers:
- url: ''
  description: APIM base path
tags:
- name: DataPower Nano Gateway API Porting Advisor
paths:
  /orgs/{org}/gateway-porting-assessments/catalogs:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/offset'
    - $ref: '#/components/parameters/limit'
    get:
      summary: List catalogs for porting compatibility assessment
      operationId: gateway_porting_assessment_listCatalogs
      security:
      - oauth:
        - child:view
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentListCatalogsResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentListCatalogsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - DataPower Nano Gateway API Porting Advisor
  /orgs/{org}/catalog/{catalog}/gateway-porting-assessments/products:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/offset'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/export_portable'
    - $ref: '#/components/parameters/expand'
    - $ref: '#/components/parameters/gateway_type'
    - $ref: '#/components/parameters/name'
    - $ref: '#/components/parameters/version'
    get:
      summary: List products with porting compatibility details for a catalog or space
      operationId: gateway_porting_assessment_listProducts
      security:
      - oauth:
        - org:manage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentListProductsResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentListProductsResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - DataPower Nano Gateway API Porting Advisor
  /orgs/{org}/gateway-porting-assessments/calculate-compatibility:
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Calculate porting compatibility for DataPower Nano Gateway
      operationId: gateway_porting_assessment_calculateCompatibility
      security:
      - oauth:
        - org:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentActionRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentActionRequest'
            examples:
              GatewayPortingAssessmentActionRequest:
                summary: Example for gateway porting assessment calculate compatibility using product object
                value:
                  catalog: sandbox
                  product:
                    name: acme-product
                    version: 1.0.0
              GatewayPortingAssessmentActionRequestProductUrl:
                summary: Example for gateway porting assessment calculate compatibility using product URL
                value:
                  catalog: sandbox
                  product_url: https://acme-apim.example.com/api/catalogs/acme-org/sandbox/products/product-id
              GatewayPortingAssessmentActionRequestSpaceScope:
                summary: Example for gateway porting assessment calculate compatibility at space scope using product object
                value:
                  catalog: sandbox
                  scope: space
                  space: development
                  product:
                    name: acme-product
                    version: 1.0.0
              GatewayPortingAssessmentActionRequestSpaceScopeProductUrl:
                summary: Example for gateway porting assessment calculate compatibility at space scope using product URL
                value:
                  catalog: sandbox
                  scope: space
                  space: development
                  product_url: https://acme-apim.example.com/api/spaces/acme-org/sandbox/development/products/product-id
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentActionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentActionResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - DataPower Nano Gateway API Porting Advisor
  /orgs/{org}/gateway-porting-assessments/create-project:
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Create an API Studio project with DataPower Nano Gateway scaffolding
      operationId: gateway_porting_assessment_createProject
      security:
      - oauth:
        - org:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentCreateProjectRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentCreateProjectRequest'
            examples:
              GatewayPortingAssessmentCreateProjectRequest:
                summary: Example for gateway porting assessment create project
                value:
                  project_name: acme-product-nano-project
                  project_title: Acme Product Nano Gateway Project
                  description: Project created from Gateway Porting Assessment
                  gateway_porting_assessment_url: https://acme-apim.example.com/api/orgs/acme-org/gateway-porting-assessments/ta-id
                  tags:
                  - porting
                  - sandbox
                  - acme-product
                  apis:
                  - acme-api
                  - billing-api
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentActionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentActionResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - DataPower Nano Gateway API Porting Advisor
  /orgs/{org}/gateway-porting-assessments/copy-apis-to-project:
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Copy product APIs to an existing API Studio project with DataPower Nano Gateway…
      description: Copy product APIs to an existing API Studio project with DataPower Nano Gateway scaffolding
      operationId: gateway_porting_assessment_copyApisToProject
      security:
      - oauth:
        - org:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentCopyApisToProjectRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentCopyApisToProjectRequest'
            examples:
              GatewayPortingAssessmentCopyApisToProjectRequest:
                summary: Example for gateway porting assessment copy APIs to project
                value:
                  project_name: acme-product-nano-project
                  gateway_porting_assessment_url: https://acme-apim.example.com/api/orgs/acme-org/gateway-porting-assessments/ta-id
                  apis:
                  - shipping-api
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentActionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentActionResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - DataPower Nano Gateway API Porting Advisor
  /orgs/{org}/gateway-porting-assessments/{gateway-porting-assessment}/report:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/gateway-porting-assessment'
    - $ref: '#/components/parameters/api_name'
    get:
      summary: Product Porting Compatibility Report for DataPower Nano Gateway
      operationId: gateway_porting_assessment_transferAssessmentDetailsReport
      security:
      - oauth:
        - org:manage
      responses:
        '200':
          description: Success
          headers:
            Content-Disposition:
              description: Indicates file should be downloaded as attachment
              schema:
                type: string
                example: attachment; filename="transfer-report.txt"
            Content-Type:
              description: MIME type of the response
              schema:
                type: string
                example: application/txt
          content:
            application/txt:
              schema:
                type: string
                format: binary
            application/octet-stream: {}
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - DataPower Nano Gateway API Porting Advisor
  /orgs/{org}/gateway-porting-assessments/download-project-scaffolding-files:
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Download API Studio project scaffolding files for DataPower Nano Gateway
      operationId: gateway_porting_assessment_downloadProjectScaffoldingFiles
      security:
      - oauth:
        - org:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentDownloadProjectScaffoldingFilesRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentDownloadProjectScaffoldingFilesRequest'
            examples:
              GatewayPortingAssessmentDownloadProjectScaffoldingFilesRequest:
                summary: Example for gateway porting assessment download project scaffolding files
                value:
                  project_name: acme-product-nano-project
                  project_title: Acme Product Nano Gateway Project
                  description: Project created from Gateway Porting Assessment
                  gateway_porting_assessment_url: https://acme-apim.example.com/api/orgs/acme-org/gateway-porting-assessments/ta-id
                  tags:
                  - porting
                  - sandbox
                  - acme-product
                  apis:
                  - acme-api
                  - billing-api
      responses:
        '200':
          description: Success
          content:
            application/zip: {}
            application/octet-stream: {}
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - DataPower Nano Gateway API Porting Advisor
  /orgs/{org}/catalog/{catalog}/gateway-porting-assessments/calculate-compatibility-bulk:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    post:
      summary: Calculate porting compatibility for DataPower Nano Gateway In Bulk
      operationId: gateway_porting_assessment_calculateCompatibilityBulk
      security:
      - oauth:
        - org:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentBulkActionRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/GatewayPortingAssessmentBulkActionRequest'
            examples:
              GatewayPortingAssessmentBulkActionRequest:
                summary: Example for gateway porting assessment calculate compatibility bulk
                value:
                  products:
                  - product:
                      name: billing-product
                      version: 2.0.0
                  - product_url: https://acme-apim.example.com/api/catalogs/acme-org/sandbox/products/product-id
              GatewayPortingAssessmentBulkActionRequestSpaceScope:
                summary: Example for gateway porting assessment calculate compatibility bulk at space scope
                value:
                  products:
                  - scope: space
                    space: development
                    product:
                      name: inventory-product
                      version: 1.5.0
                  - scope: space
                    space: development
                    product_url: https://acme-apim.example.com/api/spaces/acme-org/sandbox/development/products/product-id
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentActionResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/GatewayPortingAssessmentActionResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - DataPower Nano Gateway API Porting Advisor
components:
  schemas:
    GatewayPortingAssessmentBulkActionRequest:
      type: object
      properties:
        products:
          type: array
          items:
            oneOf:
            - type: object
              properties:
                scope:
                  type: string
                space:
                  type: string
                product_url:
                  type: string
              required:
              - product_url
              additionalProperties: false
            - type: object
              properties:
                scope:
                  type: string
                space:
                  type: string
                product:
                  type: object
                  properties:
                    name:
                      type: string
                    version:
                      type: string
                  required:
                  - name
                  - version
              required:
              - product
              additionalProperties: false
    GatewayPortingAssessmentCopyApisToProjectRequest:
      type: object
      properties:
        catalog:
          type: string
        scope:
          type: string
        space:
          type: string
        apis:
          type: array
          items:
            type: string
        project_name:
          type: string
        gateway_porting_assessment_url:
          type: string
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    GatewayPortingAssessmentListProductsResponse:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
          minimum: 0
          maximum: 2147483647
        results:
          type: array
          items:
            type: object
            additionalProperties: true
    GatewayPortingAssessmentActionResponse:
      type: object
      properties:
        ta_product_summary:
          type: object
          additionalProperties: true
        url:
          type: string
    GatewayPortingAssessmentActionRequest:
      type: object
      properties:
        catalog:
          type: string
        scope:
          type: string
        space:
          type: string
      anyOf:
      - properties:
          product_url:
            type: string
        required:
        - product_url
      - properties:
          product:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
            required:
            - name
            - version
        required:
        - product
    GatewayPortingAssessmentDownloadProjectScaffoldingFilesRequest:
      type: object
      properties:
        catalog:
          type: string
        scope:
          type: string
        space:
          type: string
        apis:
          type: array
          items:
            type: string
        project_name:
          type: string
        gateway_porting_assessment_url:
          type: string
        project_title:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
    GatewayPortingAssessmentCreateProjectRequest:
      type: object
      properties:
        catalog:
          type: string
        scope:
          type: string
        space:
          type: string
        apis:
          type: array
          items:
            type: string
        project_name:
          type: string
        gateway_porting_assessment_url:
          type: string
        project_title:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
    GatewayPortingAssessmentListCatalogsResponse:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
          minimum: 0
          maximum: 2147483647
        results:
          type: array
          items:
            type: object
            additionalProperties: true
  parameters:
    gateway-porting-assessment:
      name: gateway-porting-assessment
      in: path
      description: Gateway Porting Assessment name or id
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
    org:
      name: org
      in: path
      description: Organization name or id
      required: true
      schema:
        type: string
    export_portable:
      name: export_portable
      in: query
      description: Transfer Advisor product export portable
      required: false
      schema:
        type: string
    expand:
      name: expand
      in: query
      description: List of transient field to expand
      required: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: Offset item number from list to begin return
      required: false
      schema:
        type: integer
    gateway_type:
      name: gateway_type
      in: query
      description: The type of the gateway (datapower-gateway, datapower-api-gateway, event-gateway)
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Filter by version (exact match)
      required: false
      schema:
        type: string
    catalog:
      name: catalog
      in: path
      description: Catalog name or id
      required: true
      schema:
        type: string
    name:
      name: name
      in: query
      description: Filter by name (case-insensitive partial match)
      required: false
      schema:
        type: string
    api_name:
      name: api_name
      in: query
      description: Name of the API
      required: false
      schema:
        type: string
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/yaml:
          schema:
            $ref: '#/components/schemas/Error'
