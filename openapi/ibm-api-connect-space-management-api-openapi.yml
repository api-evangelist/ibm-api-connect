  /catalogs/{org}/{catalog}/space-invitations:
    description: The collection of Space Invitation operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    post:
      summary: Creates a space invitation
      description: 'Creates a space owner invitation in the context of a catalog.


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url

        - catalog_url

        - space_url'
      operationId: invitation_createSpaceScope
      security:
      - oauth:
        - child:create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invitation'
            examples:
              Invitation:
                summary: Example of invitation creation at space scope.
                value:
                  name: acme-invitation
                  title: Acme invitation
