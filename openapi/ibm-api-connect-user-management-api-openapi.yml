        - org:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            examples:
              User:
                summary: Example of user create.
                value:
                  summary: An example user create
                  email: acme@example.com
                  first_name: ACME
                  last_name: Lastname
                  name: acme
                  password: acme@123
                  title: ACME User
                  username: acmeuser
          application/yaml:
            schema:
              $ref: '#/components/schemas/User'
            examples:
              User:
                summary: Example of user create.
                value:
                  summary: An example user create
                  email: acme@example.com
                  first_name: ACME
                  last_name: Lastname
                  name: acme
                  password: acme@123
                  title: ACME User
                  username: acmeuser
      responses:
