        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationStyle'
            examples:
              NotificationStyle:
                summary: Example of notification style update at catalog scope.
                value:
                  title: Acme notification style
                  summary: An example notification style
                  allowed_html_tags:
                    a:
                    - class
                    - href
                    - hreflang
                    - style
                    p:
                    - class
                    - style
                    br:
                    - class
                    - style
                    h1:
                    - class
                    - id
                    - style
          application/yaml:
            schema:
              $ref: '#/components/schemas/NotificationStyle'
            examples:
              NotificationStyle:
                summary: Example of notification style update at catalog scope.
                value:
                  title: Acme notification style
                  summary: An example notification style
                  allowed_html_tags:
                    a:
                    - class
                    - href
                    - hreflang
                    - style
                    p:
                    - class
                    - style
                    br:
                    - class
                    - style
                    h1:
                    - class
                    - id
                    - style
