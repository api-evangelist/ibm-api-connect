      - oauth:
        - child:manage
      parameters:
      - $ref: '#/components/parameters/cascade'
      - $ref: '#/components/parameters/delete_old_owner'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwner'
          application/yaml:
            schema:
              $ref: '#/components/schemas/TransferOwner'
            examples:
              TransferOwnerMember:
                summary: Example of owner transfer using member url.
                value:
                  new_owner_member_url: https://api.acme-apim.example.com/api/spaces/org1/catalog1/space1/members/member1
              TransferOwnerAssociate:
                summary: Example of owner transfer using associate url.
                value:
                  new_owner_associate_url: https://api.acme-apim.example.com/api/orgs/acme-org/associates/associate-id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Space'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
  /spaces/{org}/{catalog}/{space}/email-to-owners:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/space'
    post:
      summary: Send email to owners of consumer organizations
      description: Send email to owners of consumer organizations, given consumer org and consumer group urls. For consumer group, email owners of all consumer orgs in the group.
      operationId: space_emailToOwners
      security:
      - oauth:
        - consumer-org:manage
      externalDocs:
        description: Additional documentation
        url: https://www.ibm.com/knowledge-center/api-connect/platform-apis/space#email-to-owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailToOwners'
          application/yaml:
            schema:
              $ref: '#/components/schemas/EmailToOwners'
            examples:
              EmailToOwners:
                summary: Example of email to owners.
                value:
                  subject: An email to owners
                  body: This is an example email to owners
                  content_type: text
                  consumer_org_urls:
                  - https://api.acme-apim.example.com/api/consumer-orgs/org1/catalog1/space1/consumer-org1
                  - https://api.acme-apim.example.com/api/consumer-orgs/org1/catalog1/space1/consumer-org2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailToOwnersResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/EmailToOwnersResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
