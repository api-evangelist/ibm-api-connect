servers:
- url: ''
  description: APIM base path
tags:
- name: Application Strategy management
paths:
  /apps/{org}/{catalog}/{consumer-org}/{app}/strategies:
    description: The collection of Strategy operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/consumer-org'
    - $ref: '#/components/parameters/app'
    post:
      summary: Create a Strategy object
      description: 'Create a Strategy object


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url

        - catalog_url

        - consumer_org_url

        - app_url'
      operationId: strategy_createConsumerOrgScope
      security:
      - oauth:
        - app:manage:all
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Strategy'
            examples:
              Strategy:
                summary: Example for strategy create
                value:
                  name: acme-strategy
                  title: ACME Strategy
                  summary: Example for acme strategy create
          application/yaml:
            schema:
              $ref: '#/components/schemas/Strategy'
            examples:
              Strategy:
                summary: Example for strategy create
                value:
                  name: acme-strategy
                  title: ACME Strategy
                  summary: Example for acme strategy create
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Strategy'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Application Strategy management
    get:
      summary: List the Strategy objects
      operationId: strategy_listConsumerOrgScope
      security:
      - oauth:
        - app:view:all
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/StrategyList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Application Strategy management
    delete:
      summary: Clear the Strategy objects
      operationId: strategy_clearConsumerOrgScope
      security:
      - oauth:
        - app:manage:all
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Application Strategy management
  /apps/{org}/{catalog}/{consumer-org}/{app}/strategies/{strategy}:
    description: Strategy object operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/consumer-org'
    - $ref: '#/components/parameters/app'
    - $ref: '#/components/parameters/strategy'
    get:
      summary: Get the Strategy object by name or id
      operationId: strategy_getConsumerOrgScope
      security:
      - oauth:
        - app:view:all
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Strategy'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Application Strategy management
    patch:
      summary: Update the Strategy object by name or id
      description: 'Update the Strategy object by name or id


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url

        - catalog_url

        - consumer_org_url

        - app_url'
      operationId: strategy_updateConsumerOrgScope
      security:
      - oauth:
        - app:manage:all
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Strategy'
            examples:
              Strategy:
                summary: Example for strategy update
                value:
                  title: Acme Strategy
                  summary: Example for acme strategy update
                  strategy_type: oauth2
                  dcr_config:
                    application_type: public
                    allowed_grant_types:
                    - refresh_token
                  auth_server_alias: mobile-auth-server
          application/yaml:
            schema:
              $ref: '#/components/schemas/Strategy'
            examples:
              Strategy:
                summary: Example for strategy update
                value:
                  title: Acme Strategy
                  summary: Example for acme strategy update
                  strategy_type: oauth2
                  dcr_config:
                    application_type: public
                    allowed_grant_types:
                    - refresh_token
                  auth_server_alias: mobile-auth-server
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Strategy'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Application Strategy management
    delete:
      summary: Delete the Strategy object by name or id
      operationId: strategy_delConsumerOrgScope
      security:
      - oauth:
        - app:manage:all
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Strategy'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Application Strategy management
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    ClientRegistration:
      description: Shows the configurations set for the oauth client, when using Dynamic Client Registration. This is a read only model. To update the configuration use the DynamicClientRegistrationConfig model.
      type: object
      additionalProperties: false
      properties:
        approval_pgfilename:
          type: string
          description: Approval page file name
        approval_pgfooter:
          type: string
          description: Approval page footer
        approval_pgheading:
          type: string
          description: Approval page heading
        approval_pglogo_filename:
          type: string
          description: Approval page logo filename
        approval_pgtitle:
          type: string
          description: Approval page title
        authcode_allowed:
          type: boolean
          description: Option to choose Authorization code grant type
        cl_scopes:
          type: array
          description: The scopes associated with this client
          items:
            type: string
        client_credentials_allowed:
          type: boolean
          description: Option to choose Client Credentials grant type
        client_id:
          type: string
          description: The client id
        client_secret:
          type: string
        enabled:
          type: boolean
          description: Is the client enabled?
        implicit_allowed:
          type: boolean
          description: Option to choose Implicit grant type
        name:
          type: string
          description: The client name
        notes:
          type: string
          description: Notes on the client
        pkce_type:
          type: string
          description: OAuth client level options to apply PKCE security, for the public clients using authorization code grant type. Applicable only for local auth server.
          enum:
          - not-enforced
          - enforced
          - use-global-setting
        primary_node:
          $ref: '#/components/schemas/Node'
        redirect_uris:
          type: array
          description: List of redirect urls allowed for this client
          items:
            type: string
        resource_owner_allowed:
          type: boolean
          description: Option to choose Resource Owner grant type
        shell:
          type: boolean
        token_lifetime:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Token life time
        token_refresh_limit:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The number of times token can be refreshed
        type:
          type: string
          description: specifies whether the client is either public or confidential client
        version:
          type: string
          description: The client version
    Node:
      type: object
      additionalProperties: false
      properties:
        hostId:
          type: string
        replica:
          type: integer
          minimum: 0
          maximum: 1000
    GatewaySecret:
      type: object
      additionalProperties: false
      properties:
        cached_secret:
          type: string
        secret:
          type: string
        xrayview:
          type: string
    StrategyList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Strategy'
    Strategy:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - strategy
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        scope:
          type: string
        description:
          type: string
        strategy_type:
          type: string
          enum:
          - jwt-hsa
          - jwt-rsa
          - openid-connect-hsa
          - openid-connect-rsa
          - oauth2
          - oauth2-local-hsa
          - oauth2-local-rsa
          - composite
        auth_server_alias:
          type: string
        client_id:
          type: string
        audience:
          type: string
        dcr_config:
          $ref: '#/components/schemas/DynamicClientRegistrationConfig'
        client_registration:
          $ref: '#/components/schemas/ClientRegistration'
        secret:
          type: string
          format: password
        gateway_secret:
          $ref: '#/components/schemas/GatewaySecret'
        primary_node:
          $ref: '#/components/schemas/Node'
        access_token_uris:
          type: array
          items:
            type: string
        authorization_uris:
          type: array
          items:
            type: string
        refresh_token_uris:
          type: array
          items:
            type: string
        jwt_access_token_uris:
          type: array
          items:
            type: string
        org_url:
          type: string
          format: uri
        catalog_url:
          type: string
          format: uri
        consumer_org_url:
          type: string
          format: uri
        app_url:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
          format: uri
    DynamicClientRegistrationConfig:
      type: object
      description: Accepts the configurations to be set for the oauth client, when using Dynamic Client Registration
      properties:
        allowed_grant_types:
          type: array
          description: grant types to be allowed for this client
          items:
            type: string
            enum:
            - authorization_code
            - password
            - client_credentials
            - refresh_token
            - implicit
        application_type:
          type: string
          description: type of the application
        client_id:
          type: string
          description: The client id
        client_name:
          type: string
          description: The client name
        client_secret:
          type: string
          description: The client secret
        client_type:
          type: string
          description: specifies whether the client is either public or confidential client
          enum:
          - public
          - confidential
        client_version:
          type: string
          description: The client version
        expiration_interval:
          type: string
          description: Token expiry time
        pkce_type:
          type: string
          description: OAuth client level options to apply PKCE security, for the public clients using authorization code grant type. Applicable only for local auth server.
          enum:
          - not-enforced
          - enforced
          - use-global-setting
        redirect_uris:
          type: array
          description: The redirect uris
          items:
            type: string
        refresh_count:
          type: string
          description: The number of times token can be refreshed
        scopes:
          type: array
          description: The scopes associated with this client
          items:
            type: string
  parameters:
    consumer-org:
      name: consumer-org
      in: path
      description: Consumer Organization name or id
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
    strategy:
      name: strategy
      in: path
      description: Application Strategy Management name or id
      required: true
      schema:
        type: string
    confirm:
      name: confirm
      in: query
      description: Confirmation for critical updates
      required: true
      schema:
        type: string
    fields:
      name: fields
      in: query
      description: List of field names to return
      required: false
      schema:
        type: string
    org:
      name: org
      in: path
      description: Organization name or id
      required: true
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: Offset item number from list to begin return
      required: false
      schema:
        type: integer
    catalog:
      name: catalog
      in: path
      description: Catalog name or id
      required: true
      schema:
        type: string
    app:
      name: app
      in: path
      description: Application name or id
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        application/yaml:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: /oauth2/authorize
          scopes:
            api-drafts:edit: Clear the Draft objects, Create a Draft API object, Clear all Draft API objects in all collections, Clear the Draft API objects, Update the Draft API object by id, Delete the Draft API object by id, Update the Draft API object by name and version, Delete the Draft API object by name and version
