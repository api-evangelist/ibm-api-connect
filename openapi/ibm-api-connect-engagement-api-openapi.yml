        - api-analytics:view
      responses:
        '200':
          $ref: '#/components/responses/AnomalyDetectorResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Engagement
    put:
      summary: Update an anomaly detector
      description: Updates a single anomaly detector.
      operationId: anomaly_detectors_orgUpdate
      security:
      - oauth:
        - engagement:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyDetectorUpdateRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/AnomalyDetectorUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AnomalyDetectorResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Engagement
    delete:
      summary: Delete an anomaly detector
      description: Deletes a single anomaly detector.
      operationId: anomaly_detectors_orgDelete
      security:
      - oauth:
        - engagement:manage
      responses:
        '204':
          $ref: '#/components/responses/NoContentResponse'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Engagement
