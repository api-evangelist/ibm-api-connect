openapi: 3.2.0
info:
  x-ibm-name: apim
  version: 2.0.0
  title: IBM API Connect Platform - Provider Space Management API
  description: This API provides operations for accessing API provider capability.
  termsOfService: https://www.ibm.com/legal
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
servers:
- url: ''
  description: APIM base path
tags:
- name: Space Management
paths:
  /spaces/{org}/{catalog}/{space}/task-histories:
    description: The collection of Task History operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/space'
    get:
      summary: List the Task History objects
      operationId: task_history_listSpaceScope
      security:
      - oauth:
        - approval:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHistoryList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TaskHistoryList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
  /spaces/{org}/{catalog}/{space}/task-histories/{task-history}:
    description: Task History object operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/space'
    - $ref: '#/components/parameters/task-history'
    get:
      summary: Get the Task History object by name or id
      operationId: task_history_getSpaceScope
      security:
      - oauth:
        - approval:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHistory'
            application/yaml:
              schema:
                $ref: '#/components/schemas/TaskHistory'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
  /catalogs/{org}/{catalog}/spaces:
    description: The collection of Space operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    post:
      summary: Creates a space
      description: 'Creates a space in a catalog.


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url

        - catalog_url'
      operationId: space_create
      security:
      - oauth:
        - child:create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Space'
            examples:
              Space:
                summary: Example of space creation.
                value:
                  name: acme-space
                  title: Acme space
                  summary: An example space creation
          application/yaml:
            schema:
              $ref: '#/components/schemas/Space'
            examples:
              Space:
                summary: Example of space creation.
                value:
                  name: acme-space
                  title: Acme space
                  summary: An example space creation
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Space'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
    get:
      summary: Lists spaces
      description: Returns the list of spaces in a catalog.
      operationId: space_list
      security:
      - oauth:
        - child:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/SpaceList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
    delete:
      summary: Clears spaces
      description: Deletes all spaces from a catalog.
      operationId: space_clear
      security:
      - oauth:
        - child:manage
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
  /spaces/{org}/{catalog}/{space}:
    description: Space object operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/space'
    get:
      summary: Returns a space
      description: Returns a space in a catalog.
      operationId: space_get
      security:
      - oauth:
        - child:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Space'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
    patch:
      summary: Updates a space
      description: 'Updates a space.


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url

        - catalog_url'
      operationId: space_update
      security:
      - oauth:
        - child:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Space'
            examples:
              Space:
                summary: Example of space update.
                value:
                  title: Acme space
                  summary: An example space updation
          application/yaml:
            schema:
              $ref: '#/components/schemas/Space'
            examples:
              Space:
                summary: Example of space update.
                value:
                  title: Acme space
                  summary: An example space updation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Space'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
    delete:
      summary: Deletes a space
      description: Deletes a spaces from a catalog.
      operationId: space_del
      security:
      - oauth:
        - child:manage
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
            application/yaml:
              schema:
                $ref: '#/components/schemas/Space'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Management
  /spaces/{org}/{catalog}/{space}/transfer-owner:
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/space'
    post:
      summary: Transfer owner to an associate
      operationId: space_transferOwner
