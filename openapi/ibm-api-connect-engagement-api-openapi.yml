      description: Catalog name or ID.
      required: true
      schema:
        type: string
    end_date_optional:
      name: end
      in: query
      description: 'If set, only return items with a datetime equal or older than this. The date-time value should be in ISO format. For example, 2021-07-21T00:00:000Z.

        '
