openapi: 3.2.0
info:
  x-ibm-name: apim
  version: 2.0.0
  title: IBM API Connect Platform - Provider Space Settings API
  description: This API provides operations for accessing API provider capability.
  termsOfService: https://www.ibm.com/legal
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
servers:
- url: ''
  description: APIM base path
tags:
- name: Space Settings
paths:
  /spaces/{org}/{catalog}/{space}/configured-gateway-services:
    description: The collection of Configured Gateway Service operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/catalog'
    - $ref: '#/components/parameters/space'
    post:
      summary: Creates a configured gateway service
      description: 'Adds the gateway service to the list of configured gateway services for a space.


        Required fields:

        - gateway_service_url


        Fields not allowed:

        - space_urls


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url

        - catalog_url

        - space_url

        - availability_zone_url'
      operationId: configured_gateway_service_createSpaceScope
      security:
      - oauth:
        - org:manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguredGatewayService'
            examples:
              ConfiguredGatewayService:
                summary: Example of configured gateway service creation at space scope.
                value:
                  gateway_service_url: https://acme-apim.example.com/api/orgs/org1/gateway-services/acme-gateway-service
          application/yaml:
            schema:
              $ref: '#/components/schemas/ConfiguredGatewayService'
            examples:
              ConfiguredGatewayService:
                summary: Example of configured gateway service creation at space scope.
                value:
                  gateway_service_url: https://acme-apim.example.com/api/orgs/org1/gateway-services/acme-gateway-service
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguredGatewayService'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ConfiguredGatewayService'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Settings
    get:
      summary: Lists configured gateway services
      description: Returns the list of configured gateway services for a space.
      operationId: configured_gateway_service_listSpaceScope
      security:
      - oauth:
        - org:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguredGatewayServiceList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ConfiguredGatewayServiceList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Settings
    delete:
      summary: Clears configured gateway services
      description: Removes all gateway services from the list of configured gateway services for a space.
      operationId: configured_gateway_service_clearSpaceScope
      security:
      - oauth:
        - org:manage
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Space Settings
