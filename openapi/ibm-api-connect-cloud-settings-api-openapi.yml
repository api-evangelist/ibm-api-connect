components:
  schemas:
    NotificationTemplateList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTemplate'
    JWKDefinition:
      type: object
      additionalProperties: false
      properties:
        kid:
          type: string
        x5c:
          type: array
          items:
            type: string
        kty:
          type: string
        use:
          type: string
        alg:
          type: string
        iss:
          type: string
        purpose:
          type: string
        e:
          type: string
        n:
          type: string
        d:
          type: string
        p:
          type: string
        q:
          type: string
        dp:
          type: string
        dq:
          type: string
        qi:
          type: string
    Oauth2CertsResponse:
      type: object
      additionalProperties: false
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWKDefinition'
    RoleDefaultList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefault'
    RoleDefault:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - role_default
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        role_default_type:
          type: string
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        scope:
          type: string
        permission_urls:
          type: array
          items:
            type: string
            format: uri
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
