x-aid: ibm-api-connect:ibm-api-connect-rules
x-name: IBM API Connect Rules
description: >-
  Governance and operational rules for the IBM API Connect API artifacts
  maintained in this repository.
x-tags:
  - Governance
  - Rules
  - IBM
  - API Connect
rules:
  - name: Specification Format
    description: >-
      All API descriptions in this repository must use OpenAPI 3.0 or later in
      YAML format and live under the openapi/ directory; legacy Swagger 2.0
      sources from IBM should be converted before being committed.
  - name: Authentication
    description: >-
      The v12 platform REST APIs require a bearer token from the /api/token
      endpoint (/consumer-api/token for consumer calls), requested with an
      app client_id and client_secret plus a platform API key or user
      credentials. Consumer API calls also need the X-IBM-Consumer-Context
      header. Anonymous access is limited to public portal content.
  - name: Backward Compatibility
    description: >-
      Profiles track the current v12 platform REST APIs (version 2.0.0, Portal
      Admin 1.0.0). Retired IBM Cloud-era APIs such as the V1 API are not
      listed; new integrations should target the v12 APIs.
  - name: Environment URLs
    description: >-
      There is no shared public host. Each API Connect instance, SaaS or
      self-managed, has its own platform, consumer, governance and discovery
      endpoints, listed in the toolkit credentials.json downloaded from API
      Manager. On SaaS the hosts vary by region, for example
      platform-api.us-east-b.apiconnect.automation.ibm.com; self-managed
      deployments use whatever hosts the customer configured. Base URLs in
      apis.yml are templates to fill with those values, and IBM publishes the
      specs with an empty servers URL for the same reason.
  - name: Versioning
    description: >-
      API artifacts should track the API Connect v12 API Explorer
      (https://apic-api.apiconnect.ibmcloud.com/v12/) and be refreshed when IBM
      publishes a new revision. The OpenAPI files under openapi/ are YAML
      conversions of the JSON specs listed in
      https://apic-api.apiconnect.ibmcloud.com/v12/12.1.LATEST/openapi/index.json.
  - name: APIs.yml Sync
    description: >-
      The apis.yml index in this repository must reference all OpenAPI files
      under openapi/ and be updated when artifacts change.
