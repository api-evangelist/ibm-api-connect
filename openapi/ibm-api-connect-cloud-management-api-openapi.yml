components:
  schemas:
    ResourceVisibility:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - public
          - private
          - custom
        group_urls:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uri
        org_urls:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uri
    Itopsplatform:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - itopsplatform
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        integration_url:
          type: string
          format: uri
        visibility:
          $ref: '#/components/schemas/ResourceVisibility'
        endpoint:
          $ref: '#/components/schemas/SecuredEndpoint'
        configuration:
          type: object
          additionalProperties: true
        credentials:
          $ref: '#/components/schemas/ItOpsCredentials'
        remote_api_version:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
          format: uri
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    ItOpsCredentials:
      type: object
      required:
      - authentication_type
      properties:
        authentication_type:
          type: string
          enum:
          - basic
          - apikey
      oneOf:
      - title: BasicCredentials
        required:
        - authentication_type
        - username
        - password
        properties:
          authentication_type:
            type: string
            enum:
            - basic
          username:
            type: string
          password:
            type: string
            format: password
      - title: ApiKeyCredentials
        additionalProperties: false
        required:
        - authentication_type
        - api_key
        properties:
          authentication_type:
            type: string
            enum:
            - apikey
          api_key:
            type: string
      discriminator:
        propertyName: authentication_type
        mapping:
          basic: '#/components/schemas/ItOpsCredentials/oneOf/0'
          apikey: '#/components/schemas/ItOpsCredentials/oneOf/1'
    IntegrationList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Integration'
    IntegrationDocument:
      type: object
      additionalProperties: true
      required:
      - integration
      - info
      properties:
        integration:
          type: string
          enum:
          - 1.0.0
        integration_type:
          type: string
          enum:
          - billing
          - gateway_service
          - portal_service
          - payment_method
          - notification
          - user_registry
          - governance
          - itopsplatform
        info:
          $ref: '#/components/schemas/InfoSection'
        properties:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: boolean
            - type: array
              items:
                type: string
        secured_endpoint:
          $ref: '#/components/schemas/SecuredEndpoint'
        headers:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
        configuration_schema:
          type: object
          additionalProperties: true
    Integration:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - integration
