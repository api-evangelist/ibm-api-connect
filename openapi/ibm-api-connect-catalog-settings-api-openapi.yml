            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguredGatewayService'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ConfiguredGatewayService'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Catalog Settings
