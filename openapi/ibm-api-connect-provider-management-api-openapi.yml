components:
  schemas:
    OrgList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Org'
    InvitationList:
      type: object
      additionalProperties: false
      properties:
        total_results:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    InvitationRegister:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        user:
          type: object
          additionalProperties: false
          properties:
            realm:
              type: string
            username:
              type: string
            password:
              type: string
              format: password
            email:
              type: string
              format: email
            first_name:
              type: string
            last_name:
              type: string
        org:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            title:
              type: string
            summary:
              type: string
        catalog:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            title:
              type: string
            summary:
              type: string
        space:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            title:
              type: string
            summary:
              type: string
        consumer_org:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            title:
              type: string
            summary:
              type: string
    Regenerate:
      type: object
      additionalProperties: false
      properties:
        notify:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    Org:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - org
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        org_type:
          type: string
          enum:
          - admin
          - provider
        state:
          type: string
          enum:
          - enabled
          - disabled
        owner_url:
          type: string
          format: uri
        gateway_service_urls:
          type: array
          items:
            type: string
            format: uri
        portal_service_urls:
          type: array
          items:
            type: string
            format: uri
        user_registry_urls:
          type: array
          items:
            type: string
            format: uri
        tls_client_profile_urls:
          type: array
          items:
            type: string
            format: uri
        oauth_provider_urls:
          type: array
          items:
            type: string
            format: uri
        jwt_provider_urls:
          type: array
          items:
            type: string
            format: uri
        billing_urls:
          type: array
          items:
            type: string
            format: uri
        group_urls:
          type: array
          items:
            type: string
            format: uri
        user_group_urls:
          type: array
          items:
            type: string
            format: uri
        team_urls:
          type: array
          items:
            type: string
            format: uri
        tier_url:
          type: string
          format: uri
        owner:
          $ref: '#/components/schemas/User'
        tier:
          $ref: '#/components/schemas/Tier'
        project_urls:
          type: array
          items:
            type: string
            format: uri
        gateway_porting_assessment_urls:
          type: array
          items:
            type: string
            format: uri
        programming_package_urls:
          type: array
          items:
            type: string
            format: uri
        http_transport_security_alias_urls:
          type: array
          items:
            type: string
            format: uri
        xslt_transformation_alias_urls:
          type: array
          items:
            type: string
            format: uri
        webmethods_is_service_alias_urls:
          type: array
          items:
            type: string
            format: uri
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
          format: uri
    User:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - user
        api_version:
          type: string
          readOnly: true
          enum:
          - 2.0.0
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 1023
        summary:
          type: string
          maxLength: 65535
        state:
          type: string
          enum:
          - enabled
          - disabled
        identity_provider:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
        force_password_change:
          type: boolean
        reject_tokens_issued_before:
          type:
          - string
          - 'null'
          format: date-time
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        photo:
          type: string
        last_login_at:
          type: string
          format: date-time
        member_urls:
          type: array
          items:
            type: string
            format: uri
        user_group_urls:
          type: array
          items:
            type: string
            format: uri
        team_urls:
          type: array
          items:
            type: string
            format: uri
        org_url:
          type: string
          format: uri
        user_registry_url:
          type: string
          format: uri
        hashed_password:
          type: string
        salt:
          type: string
        encrypted_data:
          type: string
        encrypted_data_hash:
          type: string
        studio:
          $ref: '#/components/schemas/Studio'
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
