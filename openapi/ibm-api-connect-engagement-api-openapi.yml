      schema:
        type: string
        example: mystring
    destination-id:
      name: destination-id
      in: path
      description: 'Engagement destination ID. This ID is globally unique across the analytics service.

        '
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    task-id:
      name: task-id
      in: path
      description: 'Engagement task ID. This ID is globally unique across the analytics service.

        '
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    detector-type:
      name: detector-type
      in: path
      description: 'Built-in anomaly detector type. Supported values: "latency", "traffic-volume", "api-event-volume".

        '
      required: true
      schema:
        type: string
        enum:
        - latency
        - traffic-volume
        - api-event-volume
    offset_optional:
      name: offset
      in: query
      description: If set, the offset to be applied when requesting a list. e.g. return events starting from the 100th result
      required: false
      schema:
        type: string
        example: '100'
    status_optional:
      name: status
      in: query
      description: Task status.
      schema:
        type: string
        enum:
        - ACTIVE
        - ACKNOWLEDGED
        - COMPLETED
        - ERROR
        - DELETED
    catalog:
