            application/yaml:
              schema:
                $ref: '#/components/schemas/AppList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Organization Application
    delete:
      summary: Clear the Application objects
      operationId: app_clear
      security:
      - oauth:
        - app:manage
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
