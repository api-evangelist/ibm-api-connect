openapi: 3.2.0
info:
  x-ibm-name: apim
  version: 2.0.0
  title: IBM API Connect Platform - Provider Drafts API
  description: This API provides operations for accessing API provider capability.
  termsOfService: https://www.ibm.com/legal
  contact:
    name: IBM
    url: https://www.ibm.com
    email: help@ibm.com
  license:
    name: tbd
    url: https://tbd.com
servers:
- url: ''
  description: APIM base path
tags:
- name: Drafts
paths:
  /orgs/{org}/drafts:
    description: The collection of Draft operations
    parameters:
    - $ref: '#/components/parameters/org'
    get:
      summary: Lists drafts
      description: Returns the complete list of draft APIs and products belonging to a provider organization.
      operationId: draft_list
      security:
      - oauth:
        - api-drafts:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DraftList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
    delete:
      summary: Deletes drafts
      description: Removes all drafts (APIs and products).
      operationId: draft_clear
      security:
      - oauth:
        - api-drafts:edit
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
  /orgs/{org}/drafts/introspect-wsdl:
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Introspect the WSDL
      operationId: draft_introspectWsdl
      security:
      - oauth:
        - api-drafts:edit
      parameters:
      - $ref: '#/components/parameters/wsdl_services'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IntrospectWsdlMultipart'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsdlServices'
            application/yaml:
              schema:
                $ref: '#/components/schemas/WsdlServices'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
  /orgs/{org}/drafts/draft-products:
    description: Draft Product operations across all collections
    parameters:
    - $ref: '#/components/parameters/org'
    post:
      summary: Creates a draft product
      description: 'Creates a draft product from the given content, which may represent an product document or a product and associated APIs.


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url'
      operationId: draft_product_create
      security:
      - oauth:
        - product-drafts:edit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftProduct'
            examples:
              DraftProduct:
                summary: Example of draft product creation.
                value:
                  info:
                    version: 1.0.0
                    title: acme draft product creation
                    name: acme-draft-product
                    summary: An example draft product creation
                  gateways:
                  - datapower-api-gateway
                  plans:
                    default-plan:
                      title: Default Plan
                      description: Default Plan
                      rate-limits:
                        default:
                          value: 100/1hour
                  apis:
                    acme-api1.0.0:
                      name: acme-api:1.0.0
                    acme2-api1.0.0:
                      name: acme2-api:1.0.0
                  visibility:
                    view:
                      type: public
                      enabled: true
                    subscribe:
                      type: authenticated
                      enabled: true
                  product: 1.0.0
          application/yaml:
            schema:
              $ref: '#/components/schemas/DraftProduct'
            examples:
              DraftProduct:
                summary: Example of draft product creation.
                value:
                  info:
                    version: 1.0.0
                    title: acme draft product creation
                    name: acme-draft-product
                    summary: An example draft product creation
                  gateways:
                  - datapower-api-gateway
                  plans:
                    default-plan:
                      title: Default Plan
                      description: Default Plan
                      rate-limits:
                        default:
                          value: 100/1hour
                  apis:
                    acme-api1.0.0:
                      name: acme-api:1.0.0
                    acme2-api1.0.0:
                      name: acme2-api:1.0.0
                  visibility:
                    view:
                      type: public
                      enabled: true
                    subscribe:
                      type: authenticated
                      enabled: true
                  product: 1.0.0
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DraftProductMultipart'
      responses:
        '201':
          description: Successful create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftProduct'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DraftProduct'
        '302':
          description: Redirect response
          headers:
            Location:
              description: Redirect payload
              schema:
                type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
    get:
      summary: Lists draft products
      description: Returns all draft products belonging to a provider organization.
      operationId: draft_product_listAll
      security:
      - oauth:
        - product-drafts:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftProductList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DraftProductList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
    delete:
      summary: Clears draft products
      description: Deletes all draft products.
      operationId: draft_product_clearAll
      security:
      - oauth:
        - product-drafts:edit
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
  /orgs/{org}/drafts/draft-products/{draft-product-name}:
    description: The collection of Draft Product operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/draft-product-name'
    get:
      summary: Lists draft product versions
      description: Returns all versions of the named draft product.
      operationId: draft_product_list
      security:
      - oauth:
        - product-drafts:view
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftProductList'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DraftProductList'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
    delete:
      summary: Clears draft product versions
      description: Deletes all versions of the named draft product.
      operationId: draft_product_clear
      security:
      - oauth:
        - product-drafts:edit
      parameters:
      - $ref: '#/components/parameters/confirm'
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
  /orgs/{org}/drafts/draft-products/{draft-product-id}:
    description: Draft Product object operations
    parameters:
    - $ref: '#/components/parameters/org'
    - $ref: '#/components/parameters/draft-product-id'
    get:
      summary: Returns a draft product
      description: Returns the given draft product.
      operationId: draft_product_get
      security:
      - oauth:
        - product-drafts:view
      parameters:
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftProduct'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DraftProduct'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
    patch:
      summary: Updates a draft product
      description: 'Updates a draft product from the given content, which may represent an product document or a product and associated APIs.


        Fields allowed but ignored:

        - id

        - type

        - api_version

        - scope

        - created_at

        - updated_at

        - url

        - org_url'
      operationId: draft_product_update
      security:
      - oauth:
        - product-drafts:edit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftProduct'
            examples:
              DraftProduct:
                summary: Example of draft product update by id.
                value:
                  info:
                    title: acme draft product update
                    summary: An example draft product update
                    version: 1.0.0
                    name: acme-draft-product
                  gateways:
                  - datapower-api-gateway
                  plans:
                    acme-plan:
                      title: acme Plan
                      description: acme Plan
                      rate-limits:
                        default:
                          value: 150/1hour
                  apis:
                    acme-api1.0.0:
                      name: acme-api:1.0.0
                  visibility:
                    view:
                      type: custom
                      orgs:
                      - acme-org
                      enabled: true
                    subscribe:
                      type: custom
                      orgs:
                      - acme-org
                      enabled: true
                  product: 1.0.0
          application/yaml:
            schema:
              $ref: '#/components/schemas/DraftProduct'
            examples:
              DraftProduct:
                summary: Example of draft product update by id.
                value:
                  info:
                    title: acme draft product update
                    summary: An example draft product update
                    version: 1.0.0
                    name: acme-draft-product
                  gateways:
                  - datapower-api-gateway
                  plans:
                    acme-plan:
                      title: acme Plan
                      description: acme Plan
                      rate-limits:
                        default:
                          value: 150/1hour
                  apis:
                    acme-api1.0.0:
                      name: acme-api:1.0.0
                  visibility:
                    view:
                      type: custom
                      orgs:
                      - acme-org
                      enabled: true
                    subscribe:
                      type: custom
                      orgs:
                      - acme-org
                      enabled: true
                  product: 1.0.0
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DraftProductMultipart'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftProduct'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DraftProduct'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
    delete:
      summary: Deletes a draft product
      description: Deletes the given product from drafts.
      operationId: draft_product_del
      security:
      - oauth:
        - product-drafts:edit
      responses:
        '200':
          description: Successful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftProduct'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DraftProduct'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      tags:
      - Drafts
